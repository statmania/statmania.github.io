project:
  type: website
  output-dir: .

website:
  title: "R Programming"
  site-url: "https://www.statmania.info/courses/rprogramming/"
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: dark
    logo: ../../img/statmania_logo.png
    left:
      - href: ../../index.html
        text: Home
        icon: house
      - href: ../index.html
        text: All Courses
        icon: mortarboard
  sidebar:
    style: docked
    background: dark
    title: "R Programming"
    contents:
      - text: "Course Overview"
        href: index.qmd
      - section: "Lessons"
        contents:
          - text: "1. Variables & Basic Types"
            href: lesson1.qmd
          - text: "2. Vectors"
            href: lesson2.qmd
          - text: "3. Functions"
            href: lesson3.qmd
          - text: "4. Control Flow"
            href: lesson4.qmd
          - text: "5. Data Frames"
            href: lesson5.qmd
          - text: "6. Plotting"
            href: lesson6.qmd
          - text: "7. Your Turn"
            href: lesson7.qmd

format:
  html:
    theme:
      - cosmo
      - dark.scss
    css: styles.css
    toc: false
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    include-after-body:
      text: |
        <script src="qwebr-force-dark.js"></script>
