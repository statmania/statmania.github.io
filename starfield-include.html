<!-- Shared Quarto include: adds the site-wide starfield to a page.
     Use from any Quarto project's _quarto.yml (path relative to that project):
       format: { html: { include-after-body: ../starfield-include.html } }
     It adds the canvas and loads /starfield.js from the site root, working out
     the root from the URL so it is the same for every page depth. The page's
     CSS must still make the canvas fixed at z-index -1 (see blograw/styles.css
     or courses/rprogramming/dark.scss). -->
<canvas class="sm-canvas" aria-hidden="true"></canvas>
<script>
(function () {
  var p = location.pathname;
  // Root = everything before the first top-level site section in the URL
  // (site is served from the domain root; locally may be under a prefix).
  var m = p.match(/^(.*?\/)(blog|courses|slide|games|utility|question|quiz|ds|research)\//);
  var s = document.createElement('script');
  s.src = (m ? m[1] : '/') + 'starfield.js';
  document.body.appendChild(s);
})();
</script>
