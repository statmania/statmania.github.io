<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">The lecture toolchain</title>
  <desc id="d">Slide content is written in R Markdown or Quarto markdown with embedded R and LaTeX, some of it generated by Python scripts, then rendered by Quarto's reveal.js format into HTML, CSS and JavaScript slides, styled and version-controlled with Git.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/></marker>
  </defs>
  <rect width="900" height="340" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="338" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <text x="450" y="32" fill="#6b7a99" font-size="12" letter-spacing="2">FROM PLAIN TEXT TO A LIVE SLIDE DECK</text>

    <!-- stage 1: sources -->
    <text x="150" y="66" fill="#00e5ff" font-size="13" font-weight="700">WRITTEN AS</text>
    <g font-size="13" fill="#e6edf7">
      <rect x="45" y="80" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="1.6"/>
      <text x="150" y="102">Markdown (.qmd)</text>
      <rect x="45" y="122" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="1.6"/>
      <text x="150" y="144">R code chunks</text>
      <rect x="45" y="164" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="1.6"/>
      <text x="150" y="186">LaTeX math</text>
      <rect x="45" y="206" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="1.6"/>
      <text x="150" y="228">YAML front matter</text>
    </g>

    <path d="M262 167 H320" stroke="#9fb3d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- stage 2: quarto -->
    <rect x="325" y="110" width="150" height="114" rx="14" fill="#0a0f1e" stroke="#a855f7" stroke-width="2.5"/>
    <text x="400" y="160" fill="#c084fc" font-size="16" font-weight="700">Quarto</text>
    <text x="400" y="182" fill="#9fb3d1" font-size="12">+ reveal.js</text>
    <text x="400" y="200" fill="#9fb3d1" font-size="12">renders</text>

    <path d="M480 167 H540" stroke="#9fb3d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- stage 3: output -->
    <text x="700" y="66" fill="#ff2fb4" font-size="13" font-weight="700">RENDERED AS</text>
    <g font-size="13" fill="#e6edf7">
      <rect x="595" y="80" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="1.6"/>
      <text x="700" y="102">HTML slides</text>
      <rect x="595" y="122" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="1.6"/>
      <text x="700" y="144">CSS styling</text>
      <rect x="595" y="164" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="1.6"/>
      <text x="700" y="186">JavaScript interactivity</text>
      <rect x="595" y="206" width="210" height="34" rx="8" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="1.6"/>
      <text x="700" y="228">qdraw annotation</text>
    </g>

    <!-- Python: generates some source files, feeding into stage 1 -->
    <path d="M150 264 V245" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="60" y="266" width="180" height="32" rx="16" fill="#0a0f1e" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="150" y="287" fill="#fde68a" font-size="13">Python scripts</text>
    <text x="150" y="310" fill="#6b7a99" font-size="11">generate some sources</text>

    <!-- bottom: tooling -->
    <text x="700" y="270" fill="#6b7a99" font-size="12">tracked with</text>
    <rect x="635" y="282" width="90" height="32" rx="16" fill="#0a0f1e" stroke="#00e5ff" stroke-width="1.6"/>
    <text x="680" y="303" fill="#8be9ff" font-size="13">Git</text>
    <rect x="735" y="282" width="120" height="32" rx="16" fill="#0a0f1e" stroke="#00e5ff" stroke-width="1.6"/>
    <text x="795" y="303" fill="#8be9ff" font-size="13">Bash / fish</text>
  </g>
</svg>
