title: Blogkit
author: Blogkit contributors
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    html:
      # light is listed first, so it is the default; Quarto adds the navbar toggle.
      # (A site cannot reorder these from its own _quarto.yml: the extension's key order wins.)
      theme:
        light: cosmo
        dark: [cosmo, theme-dark.scss]
      css: styles.css
      highlight-style:
        light: github
        dark: dracula
      include-after-body:
        - code-reveal.html
        - site-include.html
