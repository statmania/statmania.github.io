<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">LaTeX line breaks: ragged versus stretched</title>
  <desc id="d">Two paragraphs between a left and right margin. In the left one, a double backslash ends a line early and leaves a gap at the right margin. In the right one, linebreak stretches the words so the line reaches the right margin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062321"/>
      <stop offset="1" stop-color="#1c0f1d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1f4a45"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <!-- left: \\ -->
    <text x="225" y="44" font-size="22" fill="#f472b6">\\</text>
    <rect x="60" y="70" width="330" height="160" rx="10" fill="#0a2e2b" stroke="#2dd4bf" stroke-opacity=".5"/>
    <path d="M80 80 L80 220 M370 80 L370 220" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <g fill="#fde68a">
      <rect x="86" y="100" width="150" height="10" rx="5"/>
      <rect x="86" y="130" width="262" height="10" rx="5"/>
      <rect x="86" y="160" width="120" height="10" rx="5"/>
      <rect x="86" y="190" width="240" height="10" rx="5"/>
    </g>
    <text x="300" y="109" font-size="14" fill="#f472b6">gap</text>
    <text x="225" y="258" font-size="16" fill="#8aa0b8">line ends early</text>
    <!-- right: \linebreak -->
    <text x="675" y="44" font-size="22" fill="#f472b6">\linebreak</text>
    <rect x="510" y="70" width="330" height="160" rx="10" fill="#0a2e2b" stroke="#2dd4bf" stroke-opacity=".5"/>
    <path d="M530 80 L530 220 M820 80 L820 220" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <g fill="#fde68a">
      <rect x="536" y="100" width="30" height="10" rx="5"/>
      <rect x="590" y="100" width="40" height="10" rx="5"/>
      <rect x="654" y="100" width="50" height="10" rx="5"/>
      <rect x="728" y="100" width="86" height="10" rx="5"/>
      <rect x="536" y="130" width="262" height="10" rx="5"/>
      <rect x="536" y="160" width="120" height="10" rx="5"/>
      <rect x="536" y="190" width="240" height="10" rx="5"/>
    </g>
    <text x="675" y="258" font-size="16" fill="#8aa0b8">words stretched to the margin</text>
  </g>
</svg>
