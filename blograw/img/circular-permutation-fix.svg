<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="t d">
  <title id="t">Fix one person, then arrange the rest</title>
  <desc id="d">Six seats round a table. The top seat is a solid orange dot for the fixed person A. The other five seats show 5, 4, 3, 2 and 1 choices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#230f27"/>
      <stop offset="1" stop-color="#150c1d"/>
    </linearGradient>
  </defs>
  <rect width="760" height="435" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="758" height="433" rx="17" fill="none" stroke="#4a2a50"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<text x="380.0" y="42.0" font-size="25" fill="#fcd34d" text-anchor="middle" font-weight="normal">Fix A, then fill the other seats</text>
<circle cx="380.0" cy="220.0" r="120" fill="none" stroke="#6b4a70" stroke-width="2"/><circle cx="380.0" cy="100.0" r="28" fill="#ff7a30" stroke="#ffb380" stroke-width="2.5"/><text x="380.0" y="110.6" font-size="31" fill="#f6eaf4" text-anchor="middle" font-weight="bold">A</text><circle cx="483.9" cy="160.0" r="28" fill="none" stroke="#c3a6c0" stroke-width="2.5"/><text x="483.9" y="170.6" font-size="31" fill="#f6eaf4" text-anchor="middle" font-weight="bold">5</text><circle cx="483.9" cy="280.0" r="28" fill="none" stroke="#c3a6c0" stroke-width="2.5"/><text x="483.9" y="290.6" font-size="31" fill="#f6eaf4" text-anchor="middle" font-weight="bold">4</text><circle cx="380.0" cy="340.0" r="28" fill="none" stroke="#c3a6c0" stroke-width="2.5"/><text x="380.0" y="350.6" font-size="31" fill="#f6eaf4" text-anchor="middle" font-weight="bold">3</text><circle cx="276.1" cy="280.0" r="28" fill="none" stroke="#c3a6c0" stroke-width="2.5"/><text x="276.1" y="290.6" font-size="31" fill="#f6eaf4" text-anchor="middle" font-weight="bold">2</text><circle cx="276.1" cy="160.0" r="28" fill="none" stroke="#c3a6c0" stroke-width="2.5"/><text x="276.1" y="170.6" font-size="31" fill="#f6eaf4" text-anchor="middle" font-weight="bold">1</text>
<text x="380.0" y="213.0" font-size="22" fill="#5eead4" text-anchor="middle" font-weight="normal">choices</text>
<text x="380.0" y="243.0" font-size="22" fill="#5eead4" text-anchor="middle" font-weight="normal">per seat</text>
<text x="448.0" y="108.0" font-size="20" fill="#ff8a65" text-anchor="start" font-weight="normal">fixed</text>
<text x="380.0" y="405.0" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="normal">5 × 4 × 3 × 2 × 1 = 5! = 120</text>
  </g>
</svg>
