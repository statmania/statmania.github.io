<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">pdfLaTeX versus XeLaTeX</title>
  <desc id="d">Two terminal windows side by side. The left one runs pdflatex and is labelled fast and traditional; the right one runs xelatex and is labelled system fonts and Unicode, showing sample text in several scripts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#170a2b"/><stop offset="1" stop-color="#2a1240"/></linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#4a2a6b"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#f5ecff">
    <rect x="40" y="50" width="380" height="250" rx="12" fill="#0f0620" stroke="#fb923c" stroke-width="4"/>
    <circle cx="66" cy="76" r="6" fill="#fb923c"/><circle cx="88" cy="76" r="6" fill="#facc15"/><circle cx="110" cy="76" r="6" fill="#c084fc"/>
    <text x="66" y="130" font-size="22" fill="#fb923c">$ pdflatex doc.tex</text>
    <text x="66" y="175" font-size="18">TeX fonts, T1 encoding</text>
    <text x="66" y="205" font-size="18">microtype: full</text>
    <text x="66" y="250" font-size="26" fill="#facc15">fast, traditional</text>
    <rect x="480" y="50" width="380" height="250" rx="12" fill="#0f0620" stroke="#c084fc" stroke-width="4"/>
    <circle cx="506" cy="76" r="6" fill="#fb923c"/><circle cx="528" cy="76" r="6" fill="#facc15"/><circle cx="550" cy="76" r="6" fill="#c084fc"/>
    <text x="506" y="130" font-size="22" fill="#c084fc">$ xelatex doc.tex</text>
    <text x="506" y="175" font-size="18">system fonts, native Unicode</text>
    <text x="506" y="215" font-size="26" fill="#f5ecff">Aa  é ß  Ж ж  α β  ∑</text>
    <text x="506" y="250" font-size="26" fill="#facc15">multilingual</text>
    <text x="450" y="335" font-size="16" text-anchor="middle" opacity=".7">same .tex idea, two different engines</text>
  </g>
</svg>
