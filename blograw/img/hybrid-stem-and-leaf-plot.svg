<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
  <title>Stem-and-leaf plot with stems of 10 versus stems of 5, with keys</title>
  <desc>The same 24 values shown on three rows when each stem covers 10, with the key 1 | 3 means 13, and on five rows when each stem covers 5, with the key 15 | 3 means 15 + 3 = 18.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14130a"/><stop offset="1" stop-color="#242010"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="30" y="30" width="350" height="350" rx="14" fill="#1f1d10" stroke="#a3e635" stroke-width="2.5"/>
  <text x="205" y="68" text-anchor="middle" fill="#a3e635" font-size="20" font-weight="bold">Stems of 10</text>
  <text x="205" y="90" text-anchor="middle" fill="#a8a68a" font-size="13">3 rows</text>
  <text x="90" y="140" text-anchor="end" fill="#a3e635" font-size="22" font-weight="bold">0</text>
  <line x1="102" y1="120" x2="102" y2="146" stroke="#a8a68a" stroke-width="2"/>
  <text x="116" y="140" fill="#ecfccb" font-size="17" xml:space="preserve">6 8</text>
  <text x="90" y="204" text-anchor="end" fill="#a3e635" font-size="22" font-weight="bold">1</text>
  <line x1="102" y1="184" x2="102" y2="210" stroke="#a8a68a" stroke-width="2"/>
  <text x="116" y="204" fill="#ecfccb" font-size="17" xml:space="preserve">2 3 3 5 5 7 7 8 8 8 8 9</text>
  <text x="90" y="268" text-anchor="end" fill="#a3e635" font-size="22" font-weight="bold">2</text>
  <line x1="102" y1="248" x2="102" y2="274" stroke="#a8a68a" stroke-width="2"/>
  <text x="116" y="268" fill="#ecfccb" font-size="17" xml:space="preserve">0 1 3 3 3 3 4 5 7 8</text>
  <line x1="54" y1="325" x2="356" y2="325" stroke="#a3e635" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="205" y="354" text-anchor="middle" fill="#e7e5c8" font-size="15">Key: 1 | 3 means 13</text>
  <rect x="420" y="30" width="350" height="350" rx="14" fill="#1f1d10" stroke="#fb7185" stroke-width="2.5"/>
  <text x="595" y="68" text-anchor="middle" fill="#fb7185" font-size="20" font-weight="bold">Stems of 5</text>
  <text x="595" y="90" text-anchor="middle" fill="#a8a68a" font-size="13">5 rows: more detail</text>
  <text x="480" y="134" text-anchor="end" fill="#fb7185" font-size="22" font-weight="bold">5</text>
  <line x1="492" y1="114" x2="492" y2="140" stroke="#a8a68a" stroke-width="2"/>
  <text x="506" y="134" fill="#ffe4e6" font-size="17" xml:space="preserve">1 3</text>
  <text x="480" y="176" text-anchor="end" fill="#fb7185" font-size="22" font-weight="bold">10</text>
  <line x1="492" y1="156" x2="492" y2="182" stroke="#a8a68a" stroke-width="2"/>
  <text x="506" y="176" fill="#ffe4e6" font-size="17" xml:space="preserve">2 3 3</text>
  <text x="480" y="218" text-anchor="end" fill="#fb7185" font-size="22" font-weight="bold">15</text>
  <line x1="492" y1="198" x2="492" y2="224" stroke="#a8a68a" stroke-width="2"/>
  <text x="506" y="218" fill="#ffe4e6" font-size="17" xml:space="preserve">0 0 2 2 3 3 3 3 4</text>
  <text x="480" y="260" text-anchor="end" fill="#fb7185" font-size="22" font-weight="bold">20</text>
  <line x1="492" y1="240" x2="492" y2="266" stroke="#a8a68a" stroke-width="2"/>
  <text x="506" y="260" fill="#ffe4e6" font-size="17" xml:space="preserve">0 1 3 3 3 3 4</text>
  <text x="480" y="302" text-anchor="end" fill="#fb7185" font-size="22" font-weight="bold">25</text>
  <line x1="492" y1="282" x2="492" y2="308" stroke="#a8a68a" stroke-width="2"/>
  <text x="506" y="302" fill="#ffe4e6" font-size="17" xml:space="preserve">0 2 3</text>
  <line x1="444" y1="325" x2="746" y2="325" stroke="#fb7185" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="595" y="354" text-anchor="middle" fill="#e7e5c8" font-size="15">Key: 15 | 3 means 15 + 3 = 18</text>
  <text x="400" y="408" text-anchor="middle" fill="#a8a68a" font-size="14">same data, finer bins</text>
</svg>
