<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>The memoryless property</title>
<desc>A timeline with a person who has already waited 20 minutes at a bus stop and a bar showing 10 more minutes, with the note that the chance of waiting 10 more minutes is the same as for a new arrival.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14171f"/><stop offset="1" stop-color="#1b2030"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="600" y="95" text-anchor="middle" font-size="44" font-weight="bold" fill="#fb7185">The memoryless property</text>
<text x="600" y="145" text-anchor="middle" font-size="26" fill="#dbe3f2">P(X &gt; s + t | X &gt; s) = P(X &gt; t)</text>
<rect x="100" y="230" width="640" height="70" rx="12" fill="#2a3042" stroke="#7dd3fc" stroke-width="3"/>
<text x="420" y="275" text-anchor="middle" font-size="30" fill="#7dd3fc">already waited: 20 min</text>
<rect x="740" y="230" width="320" height="70" rx="12" fill="#fb7185" opacity=".25" stroke="#fb7185" stroke-width="3" stroke-dasharray="10 8"/>
<text x="900" y="275" text-anchor="middle" font-size="30" fill="#fb7185">10 more?</text>
<text x="100" y="385" font-size="28" fill="#dbe3f2">new arrival, just walked up:</text>
<rect x="100" y="405" width="320" height="70" rx="12" fill="#fb7185" opacity=".25" stroke="#fb7185" stroke-width="3" stroke-dasharray="10 8"/>
<text x="260" y="450" text-anchor="middle" font-size="30" fill="#fb7185">10 min?</text>
<path d="M100,215 V320" stroke="#dbe3f2" stroke-width="3"/><path d="M740,215 V320" stroke="#dbe3f2" stroke-width="3" stroke-dasharray="4 8"/>
<text x="600" y="565" text-anchor="middle" font-size="30" fill="#dbe3f2">same chance either way (about 0.37 for a mean wait of 10 min)</text>
</svg>