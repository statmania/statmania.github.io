<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">One config, many lecture decks</title>
  <desc id="d">A shared _quarto.yml and CSS theme apply to one qmd file per chapter. Quarto with R renders each into a reveal.js HTML deck, and the qdraw plugin adds live drawing on top.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
  </defs>
  <rect width="900" height="340" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="338" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-size="14" fill="#e8ecf7">
    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M250 105 H290 V145 H330" marker-end="url(#arrow)"/>
      <path d="M250 235 H290 V195 H330" marker-end="url(#arrow)"/>
      <path d="M560 170 H640" marker-end="url(#arrow)"/>
      <path d="M765 126 V150" stroke="#ff2fb4" marker-end="url(#arrow)"/>
    </g>
    <rect x="30" y="70" width="220" height="70" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="140" y="98">_quarto.yml</text><text x="140" y="118" font-size="12" fill="#9aa4c2">theme, transition, footer</text>
    <rect x="30" y="200" width="220" height="70" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="140" y="228">css/styles.css</text><text x="140" y="248" font-size="12" fill="#9aa4c2">colours, tables, columns</text>
    <rect x="330" y="120" width="230" height="100" rx="12" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="445" y="152">04-binomial.qmd</text>
    <text x="445" y="174" font-size="12" fill="#9aa4c2">one file per chapter:</text>
    <text x="445" y="192" font-size="12" fill="#9aa4c2">markdown + math + R chunks</text>
    <rect x="650" y="70" width="230" height="56" rx="28" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="765" y="104">qdraw: draw live</text>
    <rect x="640" y="150" width="240" height="70" rx="12" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="760" y="180">04-binomial.html</text>
    <text x="760" y="200" font-size="12" fill="#9aa4c2">reveal.js deck</text>
    <text x="450" y="300" fill="#9aa4c2" font-size="13">quarto render 04-binomial.qmd  ·  CSS-only edits need no render</text>
  </g>
</svg>
