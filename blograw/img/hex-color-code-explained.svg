<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>Anatomy of the hex colour code #FF8A3D</title>
  <desc>The code is split into three pairs, FF for red, 8A for green and 3D for blue, which are 255, 138 and 61, and together make an orange swatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d1f"/><stop offset="1" stop-color="#2a1230"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <g font-size="60" font-weight="bold" text-anchor="middle">
    <text x="175" y="84" fill="#c9b8d4">#</text>
    <text x="260" y="84" fill="#ff5d5d">FF</text>
    <text x="400" y="84" fill="#4ade80">8A</text>
    <text x="540" y="84" fill="#60a5fa">3D</text>
  </g>
  <path d="M260 104 V132" stroke="#ff5d5d" stroke-width="3"/>
  <rect x="200" y="138" width="120" height="110" rx="12" fill="#2a1230" stroke="#ff5d5d" stroke-width="3"/>
  <text x="260" y="174" text-anchor="middle" fill="#ff5d5d" font-size="20" font-weight="bold">Red</text>
  <text x="260" y="208" text-anchor="middle" fill="#f1e8f5" font-size="16">FF = 255</text>
  <text x="260" y="232" text-anchor="middle" fill="#c9b8d4" font-size="12">15×16 + 15</text>
  <path d="M400 104 V132" stroke="#4ade80" stroke-width="3"/>
  <rect x="340" y="138" width="120" height="110" rx="12" fill="#2a1230" stroke="#4ade80" stroke-width="3"/>
  <text x="400" y="174" text-anchor="middle" fill="#4ade80" font-size="20" font-weight="bold">Green</text>
  <text x="400" y="208" text-anchor="middle" fill="#f1e8f5" font-size="16">8A = 138</text>
  <text x="400" y="232" text-anchor="middle" fill="#c9b8d4" font-size="12">8×16 + 10</text>
  <path d="M540 104 V132" stroke="#60a5fa" stroke-width="3"/>
  <rect x="480" y="138" width="120" height="110" rx="12" fill="#2a1230" stroke="#60a5fa" stroke-width="3"/>
  <text x="540" y="174" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="bold">Blue</text>
  <text x="540" y="208" text-anchor="middle" fill="#f1e8f5" font-size="16">3D = 61</text>
  <text x="540" y="232" text-anchor="middle" fill="#c9b8d4" font-size="12">3×16 + 13</text>
  <path d="M400 252 V290" stroke="#c9b8d4" stroke-width="3"/><path d="M392 282 L400 294 L408 282 Z" fill="#c9b8d4"/>
  <rect x="300" y="300" width="200" height="70" rx="14" fill="#FF8A3D" stroke="#f1e8f5" stroke-width="3"/>
  <text x="400" y="402" text-anchor="middle" fill="#c9b8d4" font-size="15">red + green + blue light = one colour</text>
</svg>
