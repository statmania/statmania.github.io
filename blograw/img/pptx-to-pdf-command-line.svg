<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">A person converting PPTX slides to PDF from a terminal</title>
  <desc id="d">A sketch of a person sitting at a laptop whose screen shows a terminal command. Stacks of PPTX slide files float on the left and PDF pages float out on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#0a1719"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#3a2a22"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <!-- floating pptx files (left) -->
    <g stroke="#fb923c" stroke-width="2" fill="#2a1608">
      <rect x="40" y="52" width="96" height="34" rx="6" transform="rotate(-6 88 69)"/>
      <rect x="70" y="124" width="96" height="34" rx="6" transform="rotate(4 118 141)"/>
      <rect x="36" y="196" width="96" height="34" rx="6" transform="rotate(-3 84 213)"/>
    </g>
    <g font-size="14" fill="#fb923c">
      <text x="88" y="74" transform="rotate(-6 88 69)">a.pptx</text>
      <text x="118" y="146" transform="rotate(4 118 141)">b.pptx</text>
      <text x="84" y="218" transform="rotate(-3 84 213)">c.pptx</text>
    </g>
    <g stroke="#fb923c" stroke-width="2" fill="none" stroke-dasharray="4 5" opacity=".7">
      <path d="M176 80 Q230 100 262 140"/><path d="M178 148 Q220 150 262 150"/><path d="M172 214 Q225 200 262 165"/>
    </g>
    <!-- person -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- chair -->
      <path d="M296 150 V250" stroke="#3a4a5e" stroke-width="8" fill="none"/>
      <path d="M296 250 H350 M296 250 H256" stroke="#3a4a5e" stroke-width="8" fill="none"/>
      <!-- torso -->
      <path d="M330 140 Q312 140 310 168 L312 222 H358 L360 168 Q358 140 340 140 Z" fill="#14b8a6" stroke="#2dd4bf" stroke-width="3"/>
      <!-- legs -->
      <path d="M322 222 H410 V256" fill="none" stroke="#fb923c" stroke-width="16"/>
      <path d="M410 256 H436" fill="none" stroke="#e8ecf7" stroke-width="10"/>
      <!-- head + hair -->
      <circle cx="335" cy="108" r="26" fill="#f1c9a5" stroke="#e8b48a" stroke-width="2"/>
      <path d="M309 104 Q312 78 337 80 Q362 80 361 104 Q348 92 330 96 Q318 98 309 104 Z" fill="#7c3a14"/>
      <circle cx="347" cy="110" r="2.6" fill="#0a1719" stroke="none"/>
      <path d="M346 121 Q352 125 358 120" fill="none" stroke="#0a1719" stroke-width="2"/>
      <!-- arm to keyboard -->
      <path d="M346 156 Q384 174 418 182" fill="none" stroke="#2dd4bf" stroke-width="13"/>
      <circle cx="421" cy="183" r="7" fill="#f1c9a5" stroke="none"/>
    </g>
    <!-- desk + laptop -->
    <rect x="392" y="196" width="230" height="10" rx="3" fill="#3a4a5e"/>
    <path d="M404 196 L432 196 L436 188 L408 188 Z" fill="#26323f"/>
    <rect x="420" y="100" width="184" height="88" rx="8" fill="#0b1013" stroke="#2c3e50" stroke-width="3"/>
    <rect x="410" y="188" width="206" height="8" rx="3" fill="#26323f"/>
    <g font-size="11" text-anchor="start">
      <text x="430" y="124" fill="#8aa0b8">$</text>
      <text x="442" y="124" fill="#2dd4bf">libreoffice --headless</text>
      <text x="442" y="142" fill="#2dd4bf">--convert-to pdf *.pptx</text>
      <text x="430" y="166" fill="#8aa0b8">a.pdf  b.pdf  c.pdf</text>
    </g>
    <!-- pdf pages (right) -->
    <g stroke="#2dd4bf" stroke-width="2" fill="none" stroke-dasharray="4 5" opacity=".7">
      <path d="M612 130 Q690 90 740 80"/><path d="M614 148 Q690 148 740 148"/><path d="M612 166 Q690 205 740 214"/>
    </g>
    <g stroke="#2dd4bf" stroke-width="2" fill="#0a2420">
      <rect x="744" y="50" width="76" height="62" rx="5" transform="rotate(5 782 81)"/>
      <rect x="760" y="118" width="76" height="62" rx="5" transform="rotate(-4 798 149)"/>
      <rect x="742" y="188" width="76" height="62" rx="5" transform="rotate(3 780 219)"/>
    </g>
    <g font-size="15" fill="#2dd4bf">
      <text x="782" y="86" transform="rotate(5 782 81)">PDF</text>
      <text x="798" y="154" transform="rotate(-4 798 149)">PDF</text>
      <text x="780" y="224" transform="rotate(3 780 219)">PDF</text>
    </g>
    <g stroke="#2dd4bf" stroke-width="1.5" opacity=".6">
      <path d="M758 98 H800 M758 106 H788" transform="rotate(5 782 81)"/>
    </g>
  </g>
</svg>
