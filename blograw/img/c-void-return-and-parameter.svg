<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">void as a return type and as a parameter list in C</title>
  <desc id="d">Two function boxes. The left one, void show(int n), has an arrow going in and a dashed empty slot going out. The right one, int fortyTwo(void), has a dashed empty slot going in and an arrow coming out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#1f0e16"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#243a63"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <!-- left: void return -->
    <text x="225" y="50" font-size="18" fill="#f87171">void return</text>
    <rect x="145" y="90" width="160" height="110" rx="12" fill="#10213f" stroke="#60a5fa" stroke-width="2"/>
    <text x="225" y="140" font-size="18">show</text>
    <text x="225" y="168" font-size="14" fill="#8aa0b8">prints, no result</text>
    <path d="M40 145 L141 145" stroke="#60a5fa" stroke-width="3" marker-end="url(#ar)" fill="none"/>
    <text x="90" y="130" font-size="16" fill="#60a5fa">int n</text>
    <path d="M309 145 L400 145" stroke="#f87171" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <text x="355" y="130" font-size="16" fill="#f87171">void</text>
    <text x="225" y="240" font-size="18">void show(int n)</text>
    <!-- divider -->
    <path d="M450 40 L450 260" stroke="#243a63" stroke-width="2"/>
    <!-- right: void parameters -->
    <text x="675" y="50" font-size="18" fill="#f87171">void parameters</text>
    <rect x="595" y="90" width="160" height="110" rx="12" fill="#10213f" stroke="#60a5fa" stroke-width="2"/>
    <text x="675" y="140" font-size="18">fortyTwo</text>
    <text x="675" y="168" font-size="14" fill="#8aa0b8">needs no input</text>
    <path d="M500 145 L591 145" stroke="#f87171" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <text x="545" y="130" font-size="16" fill="#f87171">void</text>
    <path d="M759 145 L860 145" stroke="#60a5fa" stroke-width="3" marker-end="url(#ar)" fill="none"/>
    <text x="812" y="130" font-size="16" fill="#60a5fa">42</text>
    <text x="675" y="240" font-size="18">int fortyTwo(void)</text>
  </g>
</svg>
