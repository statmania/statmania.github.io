<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>COUNTIF partial match on a sample Excel product list</title>
  <desc>Excel worksheet with product names, categories and stock counts. Rows containing the substring "apple" are highlighted, and a COUNTIF formula returns 6 matching cells.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141c30" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2238"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2fb4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="420" fill="#0a0f1e"/>
  <rect width="800" height="420" fill="url(#grid)"/>

  <text x="400" y="44" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="600" fill="url(#accentGrad)">Which products contain &quot;apple&quot;?</text>

  <!-- Excel window -->
  <rect x="40" y="64" width="480" height="328" rx="10" fill="#0b1220" stroke="#1e2a4a" stroke-width="1"/>
  <path d="M 40 74 a 10 10 0 0 1 10 -10 h 460 a 10 10 0 0 1 10 10 v 16 h -480 z" fill="url(#headerGrad)"/>
  <line x1="40" y1="90" x2="520" y2="90" stroke="#1e2a4a" stroke-width="1"/>
  <circle cx="58" cy="77" r="4" fill="#ff5f57"/>
  <circle cx="74" cy="77" r="4" fill="#febc2e"/>
  <circle cx="90" cy="77" r="4" fill="#28c840"/>
  <text x="110" y="81" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" fill="#94a3b8">products.xlsx</text>

  <!-- Formula bar -->
  <rect x="40" y="90" width="480" height="28" fill="#0f172a"/>
  <line x1="40" y1="118" x2="520" y2="118" stroke="#1e2a4a" stroke-width="1"/>
  <rect x="48" y="96" width="46" height="16" rx="3" fill="#1a2238" stroke="#243254" stroke-width="1"/>
  <text x="71" y="108" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="9" fill="#00e5ff">D2</text>
  <text x="106" y="109" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5">
    <tspan fill="#64748b" font-style="italic">fx</tspan>
    <tspan fill="#00e5ff" dx="6">=COUNTIF(</tspan>
    <tspan fill="#a855f7">A2:A10</tspan>
    <tspan fill="#00e5ff">, </tspan>
    <tspan fill="#ff2fb4">&quot;*Apple*&quot;</tspan>
    <tspan fill="#00e5ff">)</tspan>
  </text>

  <!-- Column letters -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">
    <rect x="40" y="118" width="24" height="18" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="118" width="132" height="18" fill="#111827" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="118" width="96" height="18" fill="#111827" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="118" width="52" height="18" fill="#111827" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="118" width="176" height="18" fill="#111827" stroke="#1e2a4a" stroke-width="0.5"/>
    <text x="130" y="131" text-anchor="middle" fill="#00e5ff" font-weight="600">A</text>
    <text x="244" y="131" text-anchor="middle" fill="#00e5ff" font-weight="600">B</text>
    <text x="318" y="131" text-anchor="middle" fill="#00e5ff" font-weight="600">C</text>
    <text x="432" y="131" text-anchor="middle" fill="#00e5ff" font-weight="600">D</text>
  </g>

  <!-- Header row -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">
    <rect x="40" y="136" width="480" height="22" fill="#1a2238"/>
    <rect x="40" y="136" width="24" height="22" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="136" width="132" height="22" fill="#1a2238" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="136" width="96" height="22" fill="#1a2238" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="136" width="52" height="22" fill="#1a2238" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="136" width="176" height="22" fill="#1a2238" stroke="#1e2a4a" stroke-width="0.5"/>
    <text x="52" y="151" text-anchor="middle" fill="#64748b">1</text>
    <text x="70" y="151" fill="#e2e8f0">Product</text>
    <text x="202" y="151" fill="#e2e8f0">Category</text>
    <text x="298" y="151" fill="#e2e8f0">Stock</text>
    <text x="350" y="151" fill="#e2e8f0">Contains &quot;Apple&quot;</text>
  </g>

  <!-- Data rows -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#e2e8f0">
    <!-- Row 2: Green Apple (match) -->
    <rect x="40" y="158" width="480" height="24" fill="#0c2230"/>
    <rect x="344" y="158" width="176" height="24" fill="#0c2230"/>
    <rect x="40" y="158" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="158" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="158" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="158" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="158" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="158" width="3" height="24" fill="#00e5ff"/>
    <text x="52" y="173" text-anchor="middle" fill="#64748b" font-size="10">2</text>
    <text x="70" y="173">Green Apple</text>
    <text x="202" y="173" fill="#94a3b8">Fruit</text>
    <text x="298" y="173" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">42</text>
    <text x="350" y="173" fill="#00e5ff" font-weight="600">&#10003; Yes</text>

    <!-- Row 3: Apple Pie (match) -->
    <rect x="40" y="182" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="182" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="182" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="182" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="182" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="182" width="3" height="24" fill="#00e5ff"/>
    <text x="52" y="197" text-anchor="middle" fill="#64748b" font-size="10">3</text>
    <text x="70" y="197">Apple Pie</text>
    <text x="202" y="197" fill="#94a3b8">Bakery</text>
    <text x="298" y="197" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">18</text>
    <text x="350" y="197" fill="#00e5ff" font-weight="600">&#10003; Yes</text>

    <!-- Row 4: Pineapple (match) -->
    <rect x="40" y="206" width="480" height="24" fill="#0c2230"/>
    <rect x="40" y="206" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="206" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="206" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="206" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="206" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="206" width="3" height="24" fill="#00e5ff"/>
    <text x="52" y="221" text-anchor="middle" fill="#64748b" font-size="10">4</text>
    <text x="70" y="221">Pineapple</text>
    <text x="202" y="221" fill="#94a3b8">Fruit</text>
    <text x="298" y="221" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">27</text>
    <text x="350" y="221" fill="#00e5ff" font-weight="600">&#10003; Yes</text>

    <!-- Row 5: Banana (no match) -->
    <rect x="40" y="230" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="230" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="230" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="230" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="230" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <text x="52" y="245" text-anchor="middle" fill="#64748b" font-size="10">5</text>
    <text x="70" y="245">Banana</text>
    <text x="202" y="245" fill="#94a3b8">Fruit</text>
    <text x="298" y="245" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">64</text>
    <text x="350" y="245" fill="#475569">&#8212; No</text>

    <!-- Row 6: Red Apple (match) -->
    <rect x="40" y="254" width="480" height="24" fill="#0c2230"/>
    <rect x="40" y="254" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="254" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="254" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="254" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="254" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="254" width="3" height="24" fill="#00e5ff"/>
    <text x="52" y="269" text-anchor="middle" fill="#64748b" font-size="10">6</text>
    <text x="70" y="269">Red Apple</text>
    <text x="202" y="269" fill="#94a3b8">Fruit</text>
    <text x="298" y="269" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">31</text>
    <text x="350" y="269" fill="#00e5ff" font-weight="600">&#10003; Yes</text>

    <!-- Row 7: Apple Juice (match) -->
    <rect x="40" y="278" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="278" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="278" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="278" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="278" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="278" width="3" height="24" fill="#00e5ff"/>
    <text x="52" y="293" text-anchor="middle" fill="#64748b" font-size="10">7</text>
    <text x="70" y="293">Apple Juice</text>
    <text x="202" y="293" fill="#94a3b8">Drinks</text>
    <text x="298" y="293" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">55</text>
    <text x="350" y="293" fill="#00e5ff" font-weight="600">&#10003; Yes</text>

    <!-- Row 8: Mango (no match) -->
    <rect x="40" y="302" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="302" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="302" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="302" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="302" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <text x="52" y="317" text-anchor="middle" fill="#64748b" font-size="10">8</text>
    <text x="70" y="317">Mango</text>
    <text x="202" y="317" fill="#94a3b8">Fruit</text>
    <text x="298" y="317" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">12</text>
    <text x="350" y="317" fill="#475569">&#8212; No</text>

    <!-- Row 9: Custard Apple (match) -->
    <rect x="40" y="326" width="480" height="24" fill="#0c2230"/>
    <rect x="40" y="326" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="326" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="326" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="326" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="326" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="326" width="3" height="24" fill="#00e5ff"/>
    <text x="52" y="341" text-anchor="middle" fill="#64748b" font-size="10">9</text>
    <text x="70" y="341">Custard Apple</text>
    <text x="202" y="341" fill="#94a3b8">Fruit</text>
    <text x="298" y="341" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">23</text>
    <text x="350" y="341" fill="#00e5ff" font-weight="600">&#10003; Yes</text>

    <!-- Row 10: Orange (no match) -->
    <rect x="40" y="350" width="24" height="24" fill="#0f172a" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="64" y="350" width="132" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="196" y="350" width="96" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="292" y="350" width="52" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <rect x="344" y="350" width="176" height="24" fill="none" stroke="#1e2a4a" stroke-width="0.5"/>
    <text x="52" y="365" text-anchor="middle" fill="#64748b" font-size="10">10</text>
    <text x="70" y="365">Orange</text>
    <text x="202" y="365" fill="#94a3b8">Fruit</text>
    <text x="298" y="365" fill="#94a3b8" font-family="'JetBrains Mono',Consolas,monospace" font-size="10">47</text>
    <text x="350" y="365" fill="#475569">&#8212; No</text>
  </g>

  <!-- Sheet tabs -->
  <line x1="40" y1="376" x2="520" y2="376" stroke="#1e2a4a" stroke-width="1"/>
  <rect x="48" y="379" width="72" height="13" rx="2" fill="#1a2238" stroke="#243254" stroke-width="0.5"/>
  <text x="84" y="388.5" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#00e5ff">Products</text>

  <!-- Result card -->
  <rect x="544" y="96" width="216" height="136" rx="10" fill="#0f172a" stroke="#1e2a4a" stroke-width="1"/>
  <text x="564" y="120" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.2">COUNTIF RESULT</text>
  <text x="564" y="172" font-family="'Segoe UI',system-ui,sans-serif" font-size="46" font-weight="700" fill="url(#accentGrad)" filter="url(#glow)">6</text>
  <text x="612" y="172" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#e2e8f0">matching cells</text>
  <text x="564" y="196" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#94a3b8">Rows with &quot;apple&quot; anywhere</text>
  <line x1="564" y1="210" x2="740" y2="210" stroke="#1e2a4a" stroke-width="1"/>
  <text x="564" y="222" font-family="'JetBrains Mono',Consolas,monospace" font-size="9.5" fill="#64748b">case-insensitive &#183; total rows: 9</text>

  <!-- Formula card -->
  <rect x="544" y="246" width="216" height="90" rx="10" fill="#0f172a" stroke="#1e2a4a" stroke-width="1"/>
  <text x="564" y="268" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.2">FORMULA IN D2</text>
  <text x="564" y="292" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" fill="#00e5ff">=COUNTIF(<tspan fill="#a855f7">A2:A10</tspan>,</text>
  <text x="564" y="310" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" fill="#00e5ff">  <tspan fill="#ff2fb4">&quot;*Apple*&quot;</tspan>)</text>
  <text x="564" y="328" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#64748b">* = any number of characters</text>

  <!-- Legend -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#94a3b8">
    <rect x="548" y="356" width="12" height="12" rx="2" fill="#0c2230" stroke="#00e5ff" stroke-width="1"/>
    <text x="568" y="366">highlighted = partial match</text>
  </g>

  <text x="400" y="408" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#475569">COUNTIF is case-insensitive &#183; use ? to match exactly one character</text>
</svg>
