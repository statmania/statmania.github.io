<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>A characteristic function as a balance point on a circle</title>
<desc>A fair coin wrapped around the unit circle at speed t = pi/2: tails sits at 1 and heads at i. Their average, the balance point 0.5 + 0.5i, is the value of the characteristic function.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08161f"/><stop offset="1" stop-color="#10283a"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="48" font-size="25" fill="#fbbf24" font-weight="bold">characteristic function</text>
<line x1="120" y1="250" x2="470" y2="250" stroke="#dbeafe" stroke-width="1.5"/>
<line x1="295" y1="95" x2="295" y2="385" stroke="#dbeafe" stroke-width="1.5"/>
<circle cx="295" cy="250" r="125" fill="none" stroke="#5eead4" stroke-width="3.5"/>
<circle cx="420" cy="250" r="9" fill="#fbbf24"/><circle cx="295" cy="125" r="9" fill="#fbbf24"/>
<text x="420" y="285" font-size="17" fill="#fbbf24">tails</text>
<text x="312" y="122" font-size="17" fill="#fbbf24" text-anchor="start">heads</text>
<line x1="420" y1="250" x2="295" y2="125" stroke="#fbbf24" stroke-opacity=".5" stroke-dasharray="6 5"/>
<circle cx="357.5" cy="187.5" r="9" fill="#fb7185"/>
<text x="372" y="180" font-size="17" fill="#fb7185" text-anchor="start">balance point</text>
<g font-size="20" text-anchor="start" fill="#dbeafe"><text x="540" y="170">φ(t) = E[e^(itX)]</text><text x="540" y="210" font-size="16" fill="#93b4cf">fair coin, t = π/2:</text><text x="540" y="240" fill="#fb7185" font-weight="bold">φ = 0.5 + 0.5i</text><text x="540" y="290" font-size="16" fill="#93b4cf">wrap the probabilities</text><text x="540" y="314" font-size="16" fill="#93b4cf">round a circle and find</text><text x="540" y="338" font-size="16" fill="#93b4cf">where they balance</text></g>
</g></svg>
