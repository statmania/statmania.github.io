<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How a while loop runs</title>
  <desc id="d">Flowchart: set up a variable, test the condition; if true run the body and update the variable, then test again; if false leave the loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-size="16" fill="#e8ecf7">
    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M180 130 H235" marker-end="url(#arrow)"/>
      <path d="M385 130 H430" marker-end="url(#arrow)"/>
      <path d="M570 130 H610" marker-end="url(#arrow)"/>
      <path d="M675 160 V240 H310 V182" stroke="#ff2fb4" marker-end="url(#arrow)"/>
    </g>
    <rect x="25" y="100" width="155" height="60" rx="30" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="102" y="136">int i = 1;</text>
    <polygon points="310,80 385,130 310,180 235,130" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="310" y="136" font-size="14">i &lt;= 10 ?</text>
    <rect x="430" y="100" width="140" height="60" rx="10" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="500" y="125" font-size="14">body</text>
    <text x="500" y="146" font-size="14">printf(...)</text>
    <rect x="610" y="100" width="130" height="60" rx="10" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="675" y="136" font-size="14">i++;</text>
    <rect x="765" y="100" width="115" height="60" rx="30" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="822" y="136">leave</text>
    <path d="M310 80 V45 H822 V100" fill="none" stroke="#9fb3d1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="410" y="38" fill="#9aa4c2" font-size="13">false</text>
    <text x="408" y="120" fill="#00e5ff" font-size="13">true</text>
    <text x="490" y="232" fill="#ff2fb4" font-size="13">test again</text>
  </g>
</svg>
