<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>The 68-95-99.7 Empirical Rule</title>
