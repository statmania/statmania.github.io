<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Median versus mean with an outlier</title>
<desc>Page load times on a number line: four values near 1 second and one outlier at 45 seconds. The median stays at 1.3 seconds while the mean is dragged to 10 seconds.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1009"/><stop offset="1" stop-color="#2b1a10"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="55" font-size="26" fill="#ff9f43" font-weight="bold">median vs mean: one outlier</text>
<text x="400" y="88" font-size="16" fill="#f2d9c4">page load times (s): 1.1, 1.2, 1.3, 1.4, 45.0</text>
<line x1="80" y1="250" x2="720" y2="250" stroke="#f2d9c4" stroke-width="2"/>
<g fill="#f2d9c4" font-size="15"><text x="80" y="280">0</text><text x="336" y="280">20</text><text x="592" y="280">40</text></g>
<g fill="#ff9f43"><circle cx="94" cy="250" r="7"/><circle cx="107" cy="250" r="7"/><circle cx="120" cy="250" r="7"/><circle cx="133" cy="250" r="7"/><circle cx="656" cy="250" r="9" fill="#ff5d5d"/></g>
<text x="656" y="222" font-size="15" fill="#ff5d5d">outlier 45</text>
<polygon points="107,238 100,222 114,222" fill="#2dd4bf"/><text x="107" y="205" font-size="18" fill="#2dd4bf" font-weight="bold">median 1.3</text>
<polygon points="208,262 201,278 215,278" fill="#ffd166"/><text x="208" y="305" font-size="18" fill="#ffd166" font-weight="bold">mean 10.0</text>
<text x="400" y="372" font-size="17" fill="#f2d9c4">the median ignores how far the outlier goes</text>
</g></svg>
