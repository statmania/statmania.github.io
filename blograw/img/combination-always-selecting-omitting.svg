<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
<title id="t">Always selected versus always omitted</title>
<desc id="d">Ten players in a row. Top: the captain and vice-captain are locked in, so 3 more are chosen from the other 8. Bottom: two injured players are removed, so 5 are chosen from the other 8.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0b22"/><stop offset="1" stop-color="#2e1235"/></linearGradient></defs>
<rect width="900" height="440" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="450" y="46" font-size="24" font-weight="700" fill="#f5e9f7">10 players, a team of 5</text>
<text x="60" y="100" font-size="15" fill="#a3e635" text-anchor="start">ALWAYS SELECTED: captain and vice-captain are in, so fill 3 spots from 8</text>
<circle cx="60" cy="150" r="22" fill="#a3e635"/><text x="60" y="157" font-size="20" font-weight="700" fill="#2a0f2a">C</text>
<circle cx="122" cy="150" r="22" fill="#a3e635"/><text x="122" y="157" font-size="20" font-weight="700" fill="#2a0f2a">VC</text>
<circle cx="184" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="246" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="308" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="370" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="432" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="494" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="556" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="618" cy="150" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<path d="M162 186 v8 H640 v-8" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<text x="401" y="216" font-size="16" fill="#e9d5ff">choose 3 of these 8</text>
<path d="M38 186 v8 H144 v-8" fill="none" stroke="#a3e635" stroke-width="2"/>
<text x="91" y="216" font-size="16" fill="#a3e635">captain, vice</text>
<text x="800" y="148" font-size="26" font-weight="700" fill="#f5e9f7">C(8,3)</text>
<text x="800" y="174" font-size="14" fill="#c9a9cd">= 56</text>
<text x="60" y="262" font-size="15" fill="#ff9340" text-anchor="start">ALWAYS OMITTED: injured are out, so fill 5 spots from 8</text>
<circle cx="60" cy="312" r="22" fill="#ff9340"/><text x="60" y="319" font-size="20" font-weight="700" fill="#2a0f2a">✕</text>
<circle cx="122" cy="312" r="22" fill="#ff9340"/><text x="122" y="319" font-size="20" font-weight="700" fill="#2a0f2a">✕</text>
<circle cx="184" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="246" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="308" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="370" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="432" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="494" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="556" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<circle cx="618" cy="312" r="22" fill="#3a1f3d" stroke="#8c6a90" stroke-width="2"/>
<path d="M162 348 v8 H640 v-8" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<text x="401" y="378" font-size="16" fill="#e9d5ff">choose 5 of these 8</text>
<path d="M38 348 v8 H144 v-8" fill="none" stroke="#ff9340" stroke-width="2"/>
<text x="91" y="378" font-size="16" fill="#ff9340">injured</text>
<text x="800" y="310" font-size="26" font-weight="700" fill="#f5e9f7">C(8,5)</text>
<text x="800" y="336" font-size="14" fill="#c9a9cd">= 56</text>
</g></svg>