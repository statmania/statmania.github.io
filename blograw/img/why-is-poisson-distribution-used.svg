<rect x="478.0" y="210" width="119.0" height="240" rx="10" fill="#17301f" stroke="#4ade80" stroke-width="2" opacity=".9"/>
<text x="537.5" y="490" text-anchor="middle" font-size="40" font-weight="bold" fill="#86efac">2</text>
<rect x="603.0" y="210" width="119.0" height="240" rx="10" fill="#17301f" stroke="#4ade80" stroke-width="2" opacity=".9"/>
<text x="662.5" y="490" text-anchor="middle" font-size="40" font-weight="bold" fill="#86efac">4</text>
