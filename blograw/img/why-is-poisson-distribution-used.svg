<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Counting random events in fixed intervals</title>
<desc>A timeline cut into equal intervals with random events marked as amber ticks, and the number of events in each interval written below; the counts vary randomly around the average rate.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a12"/><stop offset="1" stop-color="#112417"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="600" y="110" text-anchor="middle" font-size="46" font-weight="bold" fill="#fbbf24">Poisson: counting random events</text>
<text x="600" y="165" text-anchor="middle" font-size="26" fill="#d9f5e3">events per fixed interval, at a steady average rate λ</text>
<rect x="103.0" y="210" width="119.0" height="240" rx="10" fill="#17301f" stroke="#4ade80" stroke-width="2" opacity=".9"/>
<text x="162.5" y="490" text-anchor="middle" font-size="40" font-weight="bold" fill="#86efac">2</text>
