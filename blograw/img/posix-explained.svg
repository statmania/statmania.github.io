<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>POSIX as a shared layer between programs and operating systems</title>
  <desc>A script at the top talks to the POSIX layer in the middle, which sits on top of Linux, macOS and FreeBSD at the bottom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a14"/><stop offset="1" stop-color="#1a1209"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="200" y="30" width="400" height="70" rx="12" fill="#12261d" stroke="#2dd4bf" stroke-width="2"/>
  <text x="400" y="62" text-anchor="middle" fill="#2dd4bf" font-size="20" font-weight="bold">your program / script</text>
  <text x="400" y="86" text-anchor="middle" fill="#9fb8ae" font-size="14">ls | grep | fork() | read()</text>
  <path d="M400 104 V138" stroke="#fb923c" stroke-width="3"/>
  <path d="M392 130 L400 142 L408 130 Z" fill="#fb923c"/>
  <rect x="100" y="148" width="600" height="80" rx="12" fill="#2a1a0a" stroke="#fb923c" stroke-width="3"/>
  <text x="400" y="182" text-anchor="middle" fill="#fb923c" font-size="26" font-weight="bold">POSIX</text>
  <text x="400" y="209" text-anchor="middle" fill="#e6c9a8" font-size="14">shell · utilities · system calls · signals · files</text>
  <path d="M215 232 V272 M400 232 V272 M585 232 V272" stroke="#fb923c" stroke-width="3" stroke-dasharray="6 5"/>
  <g fill="#12261d" stroke="#2dd4bf" stroke-width="2">
    <rect x="130" y="278" width="170" height="70" rx="12"/>
    <rect x="315" y="278" width="170" height="70" rx="12"/>
    <rect x="500" y="278" width="170" height="70" rx="12"/>
  </g>
  <g fill="#2dd4bf" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="215" y="320">Linux</text><text x="400" y="320">macOS</text><text x="585" y="320">FreeBSD</text>
  </g>
  <text x="400" y="390" text-anchor="middle" fill="#9fb8ae" font-size="15">one rulebook, many systems</text>
</svg>
