<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Critical thinking in the AI age</title>
  <desc id="d">An AI chip says a confident answer. A magnifying glass examines it, with a checklist of source, logic, bias, context and stakes. A human head with a lightbulb makes the final decision.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06201f"/><stop offset="1" stop-color="#0b2f2c"/></linearGradient></defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1d6b63"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e6fffa" text-anchor="middle">
    <text x="450" y="46" font-size="22" fill="#5eead4">Sounds right. Is it right?</text>

    <!-- AI chip -->
    <rect x="50" y="110" width="170" height="130" rx="14" fill="#04201e" stroke="#5eead4" stroke-width="3"/>
    <rect x="95" y="135" width="80" height="80" rx="8" fill="none" stroke="#5eead4" stroke-width="4"/>
    <text x="135" y="185" font-size="30" font-weight="bold" fill="#5eead4">AI</text>
    <g stroke="#5eead4" stroke-width="4" stroke-linecap="round">
      <path d="M115 120v15M135 120v15M155 120v15M115 215v15M135 215v15M155 215v15"/>
      <path d="M80 160h15M80 190h15M175 160h15M175 190h15"/>
    </g>
    <rect x="50" y="262" width="170" height="40" rx="20" fill="#04201e" stroke="#fbbf24" stroke-width="2"/>
    <text x="135" y="288" font-size="14" fill="#fbbf24">"Definitely true!"</text>

    <!-- magnifier + checklist -->
    <rect x="300" y="86" width="300" height="200" rx="14" fill="#04201e" stroke="#fbbf24" stroke-width="3"/>
    <g font-size="17" text-anchor="start" fill="#e6fffa">
      <text x="330" y="126"><tspan fill="#fbbf24">&#10003;</tspan> Source</text>
      <text x="330" y="156"><tspan fill="#fbbf24">&#10003;</tspan> Logic</text>
      <text x="330" y="186"><tspan fill="#fbbf24">&#10003;</tspan> Bias</text>
      <text x="330" y="216"><tspan fill="#fbbf24">&#10003;</tspan> Context</text>
      <text x="330" y="246"><tspan fill="#fbbf24">&#10003;</tspan> Stakes</text>
    </g>
    <circle cx="520" cy="170" r="42" fill="#06201f" fill-opacity="0.6" stroke="#fbbf24" stroke-width="7"/>
    <path d="M550 200 L585 238" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <text x="520" y="182" font-size="38" font-weight="bold" fill="#fbbf24">?</text>
    <text x="450" y="318" font-size="14" fill="#5eead4">verify before we trust</text>

    <!-- human head -->
    <path d="M700 270 V240 C672 232 664 205 672 180 C680 140 720 120 756 134 C792 148 800 190 786 214 C780 226 780 236 780 270 Z" fill="#04201e" stroke="#5eead4" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="738" cy="170" r="20" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <path d="M730 190h16M733 198h10" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round"><path d="M738 132v-14M708 144l-10-10M768 144l10-10"/></g>
    <text x="738" y="298" font-size="16" fill="#5eead4">we decide</text>
  </g>
</svg>
