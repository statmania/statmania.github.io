<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Discrete values versus continuous values</title>
<desc>Two number lines. The top one shows shoe sizes 7, 7.5, 8, 8.5 and 9 as separate dots. The bottom one shows a continuous length as a solid line with markers at 7.23, 7.61, 8.114 and 8.77, any value being possible.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241508"/><stop offset="1" stop-color="#2d1c0d"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="600" y="95" text-anchor="middle" font-size="44" font-weight="bold" fill="#fbbf24">Discrete or continuous?</text>
<path d="M120,230 H1080" stroke="#7a5a35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
<circle cx="180" cy="230" r="18" fill="#fbbf24"/><text x="180" y="290" text-anchor="middle" font-size="28" fill="#fde9bf">7</text><circle cx="390" cy="230" r="18" fill="#fbbf24"/><text x="390" y="290" text-anchor="middle" font-size="28" fill="#fde9bf">7.5</text><circle cx="600" cy="230" r="18" fill="#fbbf24"/><text x="600" y="290" text-anchor="middle" font-size="28" fill="#fde9bf">8</text><circle cx="810" cy="230" r="18" fill="#fbbf24"/><text x="810" y="290" text-anchor="middle" font-size="28" fill="#fde9bf">8.5</text><circle cx="1020" cy="230" r="18" fill="#fbbf24"/><text x="1020" y="290" text-anchor="middle" font-size="28" fill="#fde9bf">9</text>
<text x="120" y="180" font-size="26" fill="#fbbf24">discrete: shoe size, separate values with gaps</text>
<text x="120" y="405" font-size="26" fill="#22d3ee">continuous: a length in inches, any value in between is possible</text>
<path d="M120,470 H1080" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" opacity=".55"/>
<circle cx="276.6" cy="470" r="14" fill="#0f2a33" stroke="#22d3ee" stroke-width="4"/><text x="276.6" y="525" text-anchor="middle" font-size="26" fill="#a5f3fc">7.23</text><circle cx="436.2" cy="470" r="14" fill="#0f2a33" stroke="#22d3ee" stroke-width="4"/><text x="436.2" y="525" text-anchor="middle" font-size="26" fill="#a5f3fc">7.61</text><circle cx="647.9" cy="470" r="14" fill="#0f2a33" stroke="#22d3ee" stroke-width="4"/><text x="647.9" y="525" text-anchor="middle" font-size="26" fill="#a5f3fc">8.114</text><circle cx="923.4" cy="470" r="14" fill="#0f2a33" stroke="#22d3ee" stroke-width="4"/><text x="923.4" y="525" text-anchor="middle" font-size="26" fill="#a5f3fc">8.77</text>
<text x="600" y="585" text-anchor="middle" font-size="24" fill="#fde9bf">discrete: gaps between values   |   continuous: no gaps</text>
</svg>