<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>Installing a library in Python or R versus in C</title>
  <desc>Left: one command installs a package from a central repository. Right: in C we find the library, include its header and link it with a flag.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#0d1b3d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="40" y="40" width="320" height="340" rx="14" fill="#101c42" stroke="#60a5fa" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="bold">Python / R</text>
  <rect x="70" y="110" width="260" height="54" rx="8" fill="#0a1230" stroke="#60a5fa"/>
  <text x="200" y="143" text-anchor="middle" fill="#dbeafe" font-size="15">pip install numpy</text>
  <path d="M200 168 V206" stroke="#facc15" stroke-width="3"/><path d="M192 198 L200 210 L208 198 Z" fill="#facc15"/>
  <rect x="70" y="214" width="260" height="54" rx="8" fill="#0a1230" stroke="#60a5fa"/>
  <text x="200" y="247" text-anchor="middle" fill="#dbeafe" font-size="15">PyPI / CRAN</text>
  <text x="200" y="320" text-anchor="middle" fill="#facc15" font-size="18" font-weight="bold">one command</text>
  <text x="200" y="346" text-anchor="middle" fill="#93b4e8" font-size="13">dependencies handled for us</text>
  <rect x="440" y="40" width="320" height="340" rx="14" fill="#101c42" stroke="#facc15" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" fill="#facc15" font-size="20" font-weight="bold">C</text>
  <rect x="470" y="104" width="260" height="46" rx="8" fill="#0a1230" stroke="#facc15"/>
  <text x="600" y="133" text-anchor="middle" fill="#fef3c7" font-size="14">1. find / install the library</text>
  <rect x="470" y="164" width="260" height="46" rx="8" fill="#0a1230" stroke="#facc15"/>
  <text x="600" y="193" text-anchor="middle" fill="#fef3c7" font-size="14">2. #include its header</text>
  <rect x="470" y="224" width="260" height="46" rx="8" fill="#0a1230" stroke="#facc15"/>
  <text x="600" y="253" text-anchor="middle" fill="#fef3c7" font-size="14">3. gcc main.c -lm</text>
  <text x="600" y="320" text-anchor="middle" fill="#60a5fa" font-size="18" font-weight="bold">a few manual steps</text>
  <text x="600" y="346" text-anchor="middle" fill="#93b4e8" font-size="13">no central repository</text>
  <text x="400" y="218" text-anchor="middle" fill="#93b4e8" font-size="16">vs</text>
</svg>
