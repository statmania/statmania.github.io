<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>Call stack overflowing its limit</title>
  <desc>A column of stack frames growing downward past a dashed stack-limit line, with a crash marker, and labels for C, R and Python.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0a14"/><stop offset="1" stop-color="#3b1020"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" fill="#ffe9ee" font-weight="bold">Too many frames: the stack runs out</text>
  <g font-size="16" fill="#ffe9ee" text-anchor="middle">
    <rect x="260" y="64" width="280" height="42" rx="6" fill="#5a1a2e" stroke="#ff5d73" stroke-width="2"/><text x="400" y="91">main()</text>
    <rect x="260" y="112" width="280" height="42" rx="6" fill="#5a1a2e" stroke="#ff5d73" stroke-width="2"/><text x="400" y="139">f(n)</text>
    <rect x="260" y="160" width="280" height="42" rx="6" fill="#5a1a2e" stroke="#ff5d73" stroke-width="2"/><text x="400" y="187">f(n-1)</text>
    <rect x="260" y="208" width="280" height="42" rx="6" fill="#5a1a2e" stroke="#ff5d73" stroke-width="2"/><text x="400" y="235">f(n-2)</text>
    <rect x="260" y="256" width="280" height="42" rx="6" fill="#5a1a2e" stroke="#ff5d73" stroke-width="2"/><text x="400" y="283">...</text>
    <rect x="260" y="318" width="280" height="42" rx="6" fill="#7a1230" stroke="#c8f542" stroke-width="2" stroke-dasharray="6 4"/><text x="400" y="345" fill="#c8f542">f(n-k)  overflow</text>
  </g>
  <line x1="200" y1="306" x2="600" y2="306" stroke="#c8f542" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="610" y="311" font-size="15" fill="#c8f542">stack limit</text>
  <g font-size="15" fill="#ffb3c0"><text x="30" y="110">C: segfault</text><text x="30" y="140">R: error</text><text x="30" y="170">Python: RecursionError</text></g>
</svg>
