<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" role="img" aria-labelledby="t d">
  <title id="t">Gap method for keeping girls apart</title>
  <desc id="d">Four boys sit round a table, leaving four gaps. Three girls take three of the gaps and one gap stays empty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#230f27"/>
      <stop offset="1" stop-color="#150c1d"/>
    </linearGradient>
  </defs>
  <rect width="760" height="445" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="758" height="443" rx="17" fill="none" stroke="#4a2a50"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<text x="380.0" y="44.0" font-size="25" fill="#fcd34d" text-anchor="middle" font-weight="normal">Seat the boys, then fill the gaps</text>
<circle cx="380.0" cy="215.0" r="115" fill="none" stroke="#6b4a70" stroke-width="2"/><circle cx="380.0" cy="100.0" r="27" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="380.0" y="110.3" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">B1</text><circle cx="461.3" cy="133.7" r="27" fill="#4d3a0c" stroke="#fcd34d" stroke-width="2.5"/><text x="461.3" y="143.9" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">G1</text><circle cx="495.0" cy="215.0" r="27" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="495.0" y="225.3" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">B2</text><circle cx="461.3" cy="296.3" r="27" fill="#4d3a0c" stroke="#fcd34d" stroke-width="2.5"/><text x="461.3" y="306.6" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">G2</text><circle cx="380.0" cy="330.0" r="27" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="380.0" y="340.3" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">B3</text><circle cx="298.7" cy="296.3" r="27" fill="none" stroke="#c3a6c0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="298.7" y="306.6" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">?</text><circle cx="265.0" cy="215.0" r="27" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="265.0" y="225.3" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">B4</text><circle cx="298.7" cy="133.7" r="27" fill="#4d3a0c" stroke="#fcd34d" stroke-width="2.5"/><text x="298.7" y="143.9" font-size="30" fill="#f6eaf4" text-anchor="middle" font-weight="bold">G3</text>
<text x="380.0" y="208.0" font-size="24" fill="#5eead4" text-anchor="middle" font-weight="normal">4 gaps</text>
<text x="380.0" y="240.0" font-size="24" fill="#5eead4" text-anchor="middle" font-weight="normal">3 girls</text>
<text x="380.0" y="390.0" font-size="23" fill="#f6eaf4" text-anchor="middle" font-weight="normal">boys: 3! = 6</text>
<text x="380.0" y="422.0" font-size="23" fill="#f6eaf4" text-anchor="middle" font-weight="normal">girls: 4 × 3 × 2 = 24</text>
  </g>
</svg>
