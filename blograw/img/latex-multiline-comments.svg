<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Multi-line comments in LaTeX</title>
<desc>A short LaTeX source file where the lines between begin comment and end comment are dimmed and marked with percent signs, and a note says they are ignored in the PDF.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0f1a"/><stop offset="1" stop-color="#1d0b17"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="60" y="100" width="650" height="440" rx="16" fill="#170810" stroke="#7dd3fc" stroke-width="2.5"/>
<rect x="76" y="274" width="618" height="186" rx="8" fill="#fdba74" opacity="0.1" stroke="#fdba74" stroke-width="2" stroke-dasharray="8 8"/>
<text x="150" y="170" font-size="26" fill="#f2e9ee" opacity="1">\documentclass{article}</text>
<text x="150" y="216" font-size="26" fill="#f2e9ee" opacity="1">\begin{document}</text>
<text x="150" y="262" font-size="26" fill="#f2e9ee" opacity="1">This line is printed.</text>
<text x="150" y="308" font-size="26" fill="#fdba74" opacity="0.55">\begin{comment}</text>
<text x="110" y="308" font-size="26" fill="#fdba74">%</text>
<text x="150" y="354" font-size="26" fill="#fdba74" opacity="0.55">Everything in here is ignored,</text>
<text x="110" y="354" font-size="26" fill="#fdba74">%</text>
<text x="150" y="400" font-size="26" fill="#fdba74" opacity="0.55">however many lines it has.</text>
<text x="110" y="400" font-size="26" fill="#fdba74">%</text>
<text x="150" y="446" font-size="26" fill="#fdba74" opacity="0.55">\end{comment}</text>
<text x="110" y="446" font-size="26" fill="#fdba74">%</text>
<text x="150" y="492" font-size="26" fill="#f2e9ee" opacity="1">This line is printed too.</text>
<text x="150" y="538" font-size="26" fill="#f2e9ee" opacity="1">\end{document}</text>
<g><text x="750" y="250" font-size="40" font-weight="bold" fill="#7dd3fc">Block comments</text>
<text x="750" y="304" font-size="40" font-weight="bold" fill="#7dd3fc">in LaTeX</text>
<text x="750" y="380" font-size="26" fill="#f2e9ee">• comment package</text>
<text x="750" y="422" font-size="26" fill="#f2e9ee">• \iffalse ... \fi</text>
<text x="750" y="464" font-size="26" fill="#f2e9ee">• editor shortcut</text></g>
</svg>