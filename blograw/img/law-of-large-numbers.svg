<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Law of large numbers</title>
<desc>A running proportion of heads swings wildly for the first few flips, then settles toward 0.5 as the number of flips grows.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b0a24"/><stop offset="1" stop-color="#2a1238"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="50" font-size="26" fill="#a3e635" font-weight="bold">law of large numbers</text>
<line x1="80" y1="330" x2="740" y2="330" stroke="#e9d5ff" stroke-width="1.5"/>
<line x1="80" y1="90" x2="80" y2="330" stroke="#e9d5ff" stroke-width="1.5"/>
<line x1="80" y1="210" x2="740" y2="210" stroke="#a3e635" stroke-dasharray="6 6" stroke-width="2"/>
<text x="752" y="215" font-size="15" fill="#a3e635" text-anchor="start">0.5</text>
<path d="M90,110 L110,310 L130,150 L150,270 L175,170 L200,250 L235,185 L270,240 L310,195 L360,232 L420,205 L490,222 L560,208 L640,216 L740,210" fill="none" stroke="#f472b6" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="90" cy="110" r="6" fill="#f472b6"/>
<text x="400" y="365" font-size="16" fill="#e9d5ff">number of flips →</text>
<text x="40" y="215" font-size="16" fill="#e9d5ff" transform="rotate(-90 40 215)">proportion of heads</text>
<text x="160" y="118" font-size="15" fill="#e9d5ff">wild at first</text>
<text x="600" y="258" font-size="15" fill="#e9d5ff">settles down</text>
</g></svg>
