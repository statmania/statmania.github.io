<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Averaging angles with complex numbers</title>
<desc>A unit circle on the complex plane with two angles, 350 and 10 degrees, as points. Their complex average points at 0 degrees, not at the misleading arithmetic mean of 180 degrees.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1319"/><stop offset="1" stop-color="#1a2230"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="48" font-size="25" fill="#e879f9" font-weight="bold">complex numbers in statistics</text>
<line x1="150" y1="235" x2="650" y2="235" stroke="#d8e4f0" stroke-width="1.5"/>
<line x1="400" y1="90" x2="400" y2="385" stroke="#d8e4f0" stroke-width="1.5"/>
<circle cx="400" cy="235" r="115" fill="none" stroke="#67e8f9" stroke-width="3.5"/>
<circle cx="513.3" cy="215.0" r="8" fill="#67e8f9"/><circle cx="513.3" cy="255.0" r="8" fill="#67e8f9"/>
<text x="527.3" y="205.0" font-size="16" fill="#67e8f9" text-anchor="start">10°</text>
<text x="527.3" y="277.0" font-size="16" fill="#67e8f9" text-anchor="start">350°</text>
<line x1="400" y1="235" x2="513.3" y2="235.0" stroke="#e879f9" stroke-width="4"/>
<circle cx="513.3" cy="235.0" r="7" fill="#e879f9"/>
<text x="662" y="240" font-size="16" fill="#e879f9" text-anchor="start">mean = 0°</text>
<text x="138" y="240" font-size="16" fill="#d8e4f0" text-anchor="end">naive: 180° ✗</text>
</g></svg>