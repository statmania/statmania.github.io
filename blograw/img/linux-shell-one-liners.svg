<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">A terminal renaming files and counting them</title>
  <desc id="d">A terminal window on a dark red background shows shell commands: ls, a for loop that renames files, and find piped to wc -l. Small file icons on the right are renamed from messy names to tidy numbered ones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a0f"/>
      <stop offset="1" stop-color="#2b101a"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fda4af"/></marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#4a1f2c"/>
  <!-- terminal window -->
  <rect x="40" y="36" width="470" height="228" rx="12" fill="#12070b" stroke="#f43f5e" stroke-width="2"/>
  <path d="M40,48 a12,12 0 0 1 12,-12 h446 a12,12 0 0 1 12,12 v22 h-470 z" fill="#3a1520"/>
  <circle cx="64" cy="53" r="6" fill="#f43f5e"/><circle cx="86" cy="53" r="6" fill="#fbbf24"/><circle cx="108" cy="53" r="6" fill="#a3e635"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16">
    <text x="60" y="108" fill="#fda4af">$ <tspan fill="#ffe4e6">ls -v | cat -n</tspan></text>
    <text x="60" y="138" fill="#fda4af">$ <tspan fill="#ffe4e6">for f in *.mp4; do</tspan></text>
    <text x="80" y="166" fill="#ffe4e6">ffmpeg -i "$f" ...</text>
    <text x="60" y="194" fill="#ffe4e6">done</text>
    <text x="60" y="230" fill="#fda4af">$ <tspan fill="#ffe4e6">find . -type f | wc -l</tspan></text>
    <text x="60" y="254" fill="#f43f5e" font-weight="700">128</text>
  </g>
  <!-- files being renamed -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15">
    <g fill="#12070b" stroke-width="2">
      <rect x="570" y="52" width="130" height="38" rx="8" stroke="#fda4af"/>
      <rect x="570" y="112" width="130" height="38" rx="8" stroke="#fda4af"/>
      <rect x="570" y="172" width="130" height="38" rx="8" stroke="#fda4af"/>
      <rect x="740" y="52" width="110" height="38" rx="8" stroke="#f43f5e"/>
      <rect x="740" y="112" width="110" height="38" rx="8" stroke="#f43f5e"/>
      <rect x="740" y="172" width="110" height="38" rx="8" stroke="#f43f5e"/>
    </g>
    <g text-anchor="middle">
      <text x="635" y="77" fill="#fda4af">My Pic.JPG</text>
      <text x="635" y="137" fill="#fda4af">IMG_0042.jpg</text>
      <text x="635" y="197" fill="#fda4af">a_b c.png</text>
      <text x="795" y="77" fill="#ffe4e6">1.jpg</text>
      <text x="795" y="137" fill="#ffe4e6">2.jpg</text>
      <text x="795" y="197" fill="#ffe4e6">3.png</text>
    </g>
    <g stroke="#f43f5e" stroke-width="3" fill="none">
      <path d="M704,71 L736,71" marker-end="url(#a)"/>
      <path d="M704,131 L736,131" marker-end="url(#a)"/>
      <path d="M704,191 L736,191" marker-end="url(#a)"/>
    </g>
    <text x="710" y="250" text-anchor="middle" fill="#fda4af" font-size="16">mv, one loop for all</text>
  </g>
</svg>
