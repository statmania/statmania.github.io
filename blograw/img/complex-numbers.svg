<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>The complex plane</title>
<desc>A complex plane with a real axis, an imaginary axis, a unit circle and a vector from the origin to a point on the circle at an angle theta.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#16203a"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="48" font-size="26" fill="#fb923c" font-weight="bold">z = r·e^(iθ)</text>
<line x1="150" y1="235" x2="660" y2="235" stroke="#dbe7ff" stroke-width="2"/>
<line x1="400" y1="85" x2="400" y2="385" stroke="#dbe7ff" stroke-width="2"/>
<polygon points="660,229 674,235 660,241" fill="#dbe7ff"/><polygon points="394,85 400,71 406,85" fill="#dbe7ff"/>
<text x="700" y="241" font-size="16" fill="#dbe7ff">Real</text><text x="408" y="66" font-size="16" fill="#dbe7ff" text-anchor="start">Imaginary</text>
<circle cx="400" cy="235" r="120" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
<line x1="400" y1="235" x2="474.6" y2="141.0" stroke="#fb923c" stroke-width="3.5"/>
<circle cx="474.6" cy="141.0" r="7" fill="#fb923c"/>
<line x1="474.6" y1="141.0" x2="474.6" y2="235" stroke="#fb923c" stroke-dasharray="5 5"/>
<path d="M440,235 A40,40 0 0 0 424.9,203.7" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
<text x="458" y="221" font-size="20" fill="#38bdf8">θ</text>
<text x="488.6" y="129.0" font-size="17" fill="#fb923c" text-anchor="start">a + bi</text>
<text x="400" y="408" font-size="15" fill="#dbe7ff" opacity=".0">.</text>
</g></svg>