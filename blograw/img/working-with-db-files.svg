<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Opening a .db file</title>
<desc>A database cylinder labelled .db connected to three ways of opening it: a table viewer, a code editor and a terminal.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06222a"/><stop offset="1" stop-color="#0c3440"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="50" font-size="26" fill="#ffd6a5" font-weight="bold">working with .db files</text>
<!-- cylinder -->
<path d="M90,150 v120 a70,24 0 0 0 140,0 v-120" fill="#0f4a59" stroke="#ff6b6b" stroke-width="3.5"/>
<ellipse cx="160" cy="150" rx="70" ry="24" fill="#16627a" stroke="#ff6b6b" stroke-width="3.5"/>
<path d="M90,200 a70,24 0 0 0 140,0 M90,240 a70,24 0 0 0 140,0" fill="none" stroke="#ff6b6b" stroke-opacity=".6" stroke-width="2.5"/>
<text x="160" y="330" font-size="26" fill="#ffd6a5" font-weight="bold">data.db</text>
<text x="160" y="356" font-size="14" fill="#9fd3de">SQLite file</text>
<!-- arrows -->
<g stroke="#ff6b6b" stroke-width="3" fill="none"><path d="M240,210 H300 M300,210 V120 H350 M300,210 H350 M300,210 V300 H350"/></g>
<g fill="#ff6b6b"><polygon points="350,111 366,120 350,129"/><polygon points="350,201 366,210 350,219"/><polygon points="350,291 366,300 350,309"/></g>
<!-- viewer -->
<rect x="372" y="90" width="340" height="60" rx="10" fill="#0f4a59" stroke="#9fd3de" stroke-width="2"/>
<text x="542" y="127" font-size="19" fill="#e6fbff">DB Browser for SQLite</text>
<!-- editor -->
<rect x="372" y="180" width="340" height="60" rx="10" fill="#0f4a59" stroke="#9fd3de" stroke-width="2"/>
<text x="542" y="217" font-size="19" fill="#e6fbff">VS Code extension</text>
<!-- terminal -->
<rect x="372" y="270" width="340" height="60" rx="10" fill="#0f4a59" stroke="#9fd3de" stroke-width="2"/>
<text x="542" y="307" font-size="19" fill="#ffd6a5">$ sqlite3 data.db</text>
</g></svg>
