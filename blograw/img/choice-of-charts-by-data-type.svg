<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Choosing a chart by data type</title>
<desc>A decision diagram: categorical data leads to bar charts, pie charts and Pareto charts; quantitative data leads to histograms, density plots, box plots, line graphs and scatter plots; both together lead to box plots by group and faceted histograms.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08171f"/><stop offset="1" stop-color="#0d2530"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="400" y="60" width="400" height="90" rx="45" fill="#10303d" stroke="#e3f4fb" stroke-width="3"/><text x="600" y="115" text-anchor="middle" font-size="30" font-weight="bold" fill="#e3f4fb">What is the data type?</text><path d="M600,150 C600,200 215,200 215,248" fill="none" stroke="#e3f4fb" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M600,150 C600,200 600,200 600,248" fill="none" stroke="#e3f4fb" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M600,150 C600,200 985,200 985,248" fill="none" stroke="#e3f4fb" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><rect x="40" y="250" width="350" height="300" rx="14" fill="#0a1d26" stroke="#fbbf24" stroke-width="3"/><text x="215.0" y="296" text-anchor="middle" font-size="30" font-weight="bold" fill="#fbbf24">Categorical</text><text x="70" y="346" font-size="24" fill="#e3f4fb">• bar chart</text><text x="70" y="384" font-size="24" fill="#e3f4fb">• stacked / grouped bar</text><text x="70" y="422" font-size="24" fill="#e3f4fb">• pie or donut (few)</text><text x="70" y="460" font-size="24" fill="#e3f4fb">• Pareto chart</text>
<rect x="425" y="250" width="350" height="300" rx="14" fill="#0a1d26" stroke="#38bdf8" stroke-width="3"/><text x="600.0" y="296" text-anchor="middle" font-size="30" font-weight="bold" fill="#38bdf8">Quantitative</text><text x="455" y="346" font-size="24" fill="#e3f4fb">• histogram</text><text x="455" y="384" font-size="24" fill="#e3f4fb">• density / area</text><text x="455" y="422" font-size="24" fill="#e3f4fb">• box plot</text><text x="455" y="460" font-size="24" fill="#e3f4fb">• line graph</text><text x="455" y="498" font-size="24" fill="#e3f4fb">• scatter plot</text>
<rect x="810" y="250" width="350" height="300" rx="14" fill="#0a1d26" stroke="#f472b6" stroke-width="3"/><text x="985.0" y="296" text-anchor="middle" font-size="30" font-weight="bold" fill="#f472b6">Both together</text><text x="840" y="346" font-size="24" fill="#e3f4fb">• side-by-side box</text><text x="840" y="384" font-size="24" fill="#e3f4fb">• plots by group</text><text x="840" y="422" font-size="24" fill="#e3f4fb">• faceted histograms</text>
<text x="600" y="598" text-anchor="middle" font-size="22" fill="#9fd3e6">data type first, chart second</text>
</svg>