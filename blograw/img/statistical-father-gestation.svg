<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>Length of pregnancy as a bell curve with the 349 and 360 day marks</title>
  <desc>A bell curve of pregnancy length centred on 280 days. The mean of 280 days is marked at the peak, and the 349 day case and the 360 day limit (mean plus three standard deviations) are marked far out in the right tail.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a1f3d" stroke-width="0.5"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0f24"/><stop offset="1" stop-color="#120a1a"/></linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f43f8e"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>
  <text x="400" y="46" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700" fill="#f43f8e">How long is too long?</text>
  <text x="400" y="72" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#cbd5e1">Length of pregnancy follows a bell curve (illustrative)</text>
  <line x1="60" y1="330" x2="740" y2="330" stroke="#8b6b99" stroke-width="1.5"/>
  <polygon points="60,330 60.0,329.8 72.4,329.7 84.7,329.5 97.1,329.2 109.5,328.7 121.8,327.9 134.2,326.7 146.5,325.0 158.9,322.6 171.3,319.3 183.6,314.9 196.0,309.1 208.4,301.6 220.7,292.4 233.1,281.3 245.5,268.3 257.8,253.6 270.2,237.5 282.5,220.5 294.9,203.3 307.3,186.6 319.6,171.3 332.0,158.3 344.4,148.4 356.7,142.1 369.1,140.0 381.5,142.1 393.8,148.4 406.2,158.3 418.5,171.3 430.9,186.6 443.3,203.3 455.6,220.5 468.0,237.5 480.4,253.6 492.7,268.3 505.1,281.3 517.5,292.4 529.8,301.6 542.2,309.1 554.5,314.9 566.9,319.3 579.3,322.6 591.6,325.0 604.0,326.7 616.4,327.9 628.7,328.7 641.1,329.2 653.5,329.5 665.8,329.7 678.2,329.8 690.5,329.9 702.9,329.9 715.3,330.0 727.6,330.0 740.0,330.0 740,330" fill="#f43f8e" fill-opacity="0.16"/>
  <polyline points="60.0,329.8 72.4,329.7 84.7,329.5 97.1,329.2 109.5,328.7 121.8,327.9 134.2,326.7 146.5,325.0 158.9,322.6 171.3,319.3 183.6,314.9 196.0,309.1 208.4,301.6 220.7,292.4 233.1,281.3 245.5,268.3 257.8,253.6 270.2,237.5 282.5,220.5 294.9,203.3 307.3,186.6 319.6,171.3 332.0,158.3 344.4,148.4 356.7,142.1 369.1,140.0 381.5,142.1 393.8,148.4 406.2,158.3 418.5,171.3 430.9,186.6 443.3,203.3 455.6,220.5 468.0,237.5 480.4,253.6 492.7,268.3 505.1,281.3 517.5,292.4 529.8,301.6 542.2,309.1 554.5,314.9 566.9,319.3 579.3,322.6 591.6,325.0 604.0,326.7 616.4,327.9 628.7,328.7 641.1,329.2 653.5,329.5 665.8,329.7 678.2,329.8 690.5,329.9 702.9,329.9 715.3,330.0 727.6,330.0 740.0,330.0" fill="none" stroke="url(#curve)" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="369" y1="140" x2="369" y2="330" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="369" y="126" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" font-weight="700" fill="#facc15">mean = 280 days</text>
  <line x1="582" y1="322" x2="582" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="560" y="256" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#e2e8f0">349 days</text>
  <text x="560" y="274" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">Hadlum case</text>
  <line x1="616" y1="326" x2="616" y2="212" stroke="#f43f8e" stroke-width="2"/>
  <text x="660" y="198" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#f43f8e">360 days</text>
  <text x="660" y="216" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">mean + 3 SD</text>
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="122" y="352">200</text><text x="246" y="352">240</text><text x="369" y="352">280</text><text x="493" y="352">320</text><text x="616" y="352">360</text>
  </g>
  <text x="400" y="392" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#94a3b8">days from conception window to birth</text>
</svg>
