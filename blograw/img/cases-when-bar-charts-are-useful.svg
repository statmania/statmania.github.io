<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>When bar charts are useful</title>
<desc>A grouped bar chart with three groups of two bars of different heights, one bar highlighted, on a dark background.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12162b"/><stop offset="1" stop-color="#1a1f3d"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g transform="translate(-20,0)"><rect x="120" y="280" width="60" height="220" rx="6" fill="#7c8cff"/><rect x="200" y="350" width="60" height="150" rx="6" fill="#ff7a7a"/><rect x="380" y="220" width="60" height="280" rx="6" fill="#7c8cff"/><rect x="460" y="170" width="60" height="330" rx="6" fill="#ff7a7a" stroke="#ffd166" stroke-width="4"/><rect x="640" y="340" width="60" height="160" rx="6" fill="#7c8cff"/><rect x="720" y="260" width="60" height="240" rx="6" fill="#ff7a7a"/>
<path d="M60,500 H830" stroke="#9aa4e0" stroke-width="3"/><text x="190" y="540" text-anchor="middle" font-size="26" fill="#d6dbff">A</text><text x="450" y="540" text-anchor="middle" font-size="26" fill="#d6dbff">B</text><text x="710" y="540" text-anchor="middle" font-size="26" fill="#d6dbff">C</text></g>
<g><text x="830" y="210" font-size="36" font-weight="bold" fill="#7c8cff">Bar charts:</text>
<text x="830" y="258" font-size="36" font-weight="bold" fill="#7c8cff">length = value</text>
<text x="830" y="335" font-size="25" fill="#d6dbff">• categories</text><text x="830" y="373" font-size="25" fill="#d6dbff">• ordered scales</text>
<text x="830" y="411" font-size="25" fill="#d6dbff">• time blocks</text><text x="830" y="449" font-size="25" fill="#d6dbff">• parts of a whole</text>
<text x="830" y="487" font-size="25" fill="#ff7a7a">• long labels: horizontal</text></g>
</svg>