<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Removing fan noise from a Linux laptop microphone</title>
  <desc id="d">A fan emits noise waves that reach the internal microphone; three fixes are shown: lower gain, noise suppression filter, and an external microphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff2fb4"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <circle cx="110" cy="110" r="45" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <g fill="#ff2fb4" opacity=".8">
      <path d="M110 110 L110 70 A40 40 0 0 1 145 90 Z"/>
      <path d="M110 110 L145 130 A40 40 0 0 1 110 150 Z"/>
      <path d="M110 110 L75 130 A40 40 0 0 1 75 90 Z"/>
    </g>
    <text x="110" y="190" font-size="16" fill="#9aa4c2">fan</text>
    <g fill="none" stroke="#ff2fb4" stroke-width="2" opacity=".7">
      <path d="M170 90 Q185 110 170 130"/>
      <path d="M190 80 Q212 110 190 140"/>
      <path d="M210 70 Q240 110 210 150"/>
    </g>
    <path d="M250 110 H330" stroke="#ff2fb4" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="335" y="75" width="150" height="70" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="410" y="105" font-size="16">internal mic</text>
    <text x="410" y="128" font-size="13" fill="#9aa4c2">hum + hiss</text>
    <path d="M485 110 H540" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <g stroke="#00e5ff" stroke-width="2" fill="#0a0f1e">
      <rect x="545" y="30" width="300" height="60" rx="8"/>
      <rect x="545" y="120" width="300" height="60" rx="8"/>
      <rect x="545" y="210" width="300" height="60" rx="8"/>
    </g>
    <g font-size="16" fill="#00e5ff">
      <text x="695" y="66">1. lower mic gain</text>
      <text x="695" y="156">2. noise suppression</text>
      <text x="695" y="246">3. external mic</text>
    </g>
  </g>
</svg>
