<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Choose first, arrange second</title>
  <desc id="d">Five letter tiles in a pool; two are chosen (combination), then the chosen tiles are placed into numbered slots in order (permutation).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06140f"/><stop offset="1" stop-color="#0d2a1f"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <text x="450" y="52" font-size="26" font-weight="700" fill="#e6f5ec">choose first, arrange second</text>

    <!-- pool -->
    <rect x="50" y="110" width="330" height="190" rx="18" fill="#0a1f17" stroke="#34d399" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="215" y="140" font-size="16" fill="#6ee7b7">pool of items</text>
    <g font-size="26" font-weight="700">
      <rect x="75"  y="170" width="52" height="52" rx="10" fill="#34d399"/><text x="101" y="205" fill="#052016">A</text>
      <rect x="145" y="170" width="52" height="52" rx="10" fill="#1b3a2e" stroke="#4b7f69"/><text x="171" y="205" fill="#9fc9b8">B</text>
      <rect x="215" y="170" width="52" height="52" rx="10" fill="#34d399"/><text x="241" y="205" fill="#052016">C</text>
      <rect x="285" y="170" width="52" height="52" rx="10" fill="#1b3a2e" stroke="#4b7f69"/><text x="311" y="205" fill="#9fc9b8">D</text>
      <rect x="145" y="235" width="52" height="52" rx="10" fill="#1b3a2e" stroke="#4b7f69"/><text x="171" y="270" fill="#9fc9b8">E</text>
    </g>

    <!-- arrow 1 -->
    <path d="M388 205 H 490" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#ar)"/>
    <text x="440" y="188" font-size="15" fill="#fbbf24">pick</text>

    <!-- slots -->
    <text x="670" y="140" font-size="16" fill="#fcd34d">ordered slots</text>
    <g font-size="26" font-weight="700">
      <rect x="560" y="170" width="70" height="70" rx="12" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <rect x="572" y="179" width="46" height="52" rx="10" fill="#34d399"/><text x="595" y="214" fill="#052016">C</text>
      <text x="595" y="262" font-size="14" fill="#fcd34d" font-weight="400">1st</text>
      <rect x="710" y="170" width="70" height="70" rx="12" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <rect x="722" y="179" width="46" height="52" rx="10" fill="#34d399"/><text x="745" y="214" fill="#052016">A</text>
      <text x="745" y="262" font-size="14" fill="#fcd34d" font-weight="400">2nd</text>
    </g>

    <!-- labels -->
    <text x="215" y="345" font-size="19" fill="#34d399">Step 1: combination</text>
    <text x="215" y="372" font-size="15" fill="#9fc9b8">C(n, r): order ignored</text>
    <text x="675" y="345" font-size="19" fill="#fbbf24">Step 2: permutation</text>
    <text x="675" y="372" font-size="15" fill="#9fc9b8">r!: every order counts</text>
    <text x="450" y="405" font-size="17" fill="#e6f5ec">total = C(n, r) × r!</text>
  </g>
</svg>
