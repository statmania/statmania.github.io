<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
  <title>A stem-and-leaf plot beside a histogram of the same ten scores</title>
  <desc>Left: a stem-and-leaf plot keeping the exact scores. Right: a histogram of the same scores with bars of height 3, 4 and 3 for the 70s, 80s and 90s.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1f"/><stop offset="1" stop-color="#141036"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="30" y="30" width="350" height="340" rx="14" fill="#0f1330" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="205" y="68" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold">Stem-and-leaf</text>
  <text x="205" y="90" text-anchor="middle" fill="#8b93b8" font-size="13">keeps the exact values</text>
  <text x="110" y="165" text-anchor="end" fill="#38bdf8" font-size="26" font-weight="bold">7</text>
  <line x1="124" y1="141" x2="124" y2="173" stroke="#8b93b8" stroke-width="2"/>
  <text x="140" y="165" fill="#e0f2fe" font-size="22" xml:space="preserve">2 4 5</text>
  <text x="110" y="223" text-anchor="end" fill="#38bdf8" font-size="26" font-weight="bold">8</text>
  <line x1="124" y1="199" x2="124" y2="231" stroke="#8b93b8" stroke-width="2"/>
  <text x="140" y="223" fill="#e0f2fe" font-size="22" xml:space="preserve">1 3 3 5</text>
  <text x="110" y="281" text-anchor="end" fill="#38bdf8" font-size="26" font-weight="bold">9</text>
  <line x1="124" y1="257" x2="124" y2="289" stroke="#8b93b8" stroke-width="2"/>
  <text x="140" y="281" fill="#e0f2fe" font-size="22" xml:space="preserve">1 4 8</text>
  <text x="205" y="345" text-anchor="middle" fill="#e0e7ff" font-size="14">Key: 7 | 2 means 72</text>
  <rect x="420" y="30" width="350" height="340" rx="14" fill="#0f1330" stroke="#f472b6" stroke-width="2.5"/>
  <text x="595" y="68" text-anchor="middle" fill="#f472b6" font-size="20" font-weight="bold">Histogram</text>
  <text x="595" y="90" text-anchor="middle" fill="#8b93b8" font-size="13">shows counts per bin</text>
  <line x1="460" y1="320" x2="740" y2="320" stroke="#8b93b8" stroke-width="2"/>
  <rect x="470" y="170" width="84" height="150" fill="#f472b6" fill-opacity="0.85" stroke="#fce7f3" stroke-width="2"/>
  <text x="512" y="162" text-anchor="middle" fill="#fce7f3" font-size="16" font-weight="bold">3</text>
  <text x="512" y="344" text-anchor="middle" fill="#e0e7ff" font-size="14">70s</text>
  <rect x="560" y="120" width="84" height="200" fill="#f472b6" fill-opacity="0.85" stroke="#fce7f3" stroke-width="2"/>
  <text x="602" y="112" text-anchor="middle" fill="#fce7f3" font-size="16" font-weight="bold">4</text>
  <text x="602" y="344" text-anchor="middle" fill="#e0e7ff" font-size="14">80s</text>
  <rect x="650" y="170" width="84" height="150" fill="#f472b6" fill-opacity="0.85" stroke="#fce7f3" stroke-width="2"/>
  <text x="692" y="162" text-anchor="middle" fill="#fce7f3" font-size="16" font-weight="bold">3</text>
  <text x="692" y="344" text-anchor="middle" fill="#e0e7ff" font-size="14">90s</text>
  <text x="400" y="404" text-anchor="middle" fill="#8b93b8" font-size="14">a text-based histogram turned on its side</text>
</svg>
