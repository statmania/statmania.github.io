<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>How giscus comments work</title>
  <desc>A blog post page embeds a giscus comment box, which reads and writes a GitHub Discussion in the site's repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1209"/>
      <stop offset="1" stop-color="#0b0a07"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#f5e9d8">
    <!-- blog page -->
    <rect x="70" y="150" width="300" height="340" rx="14" fill="#241810" stroke="#ffb454" stroke-width="3"/>
    <rect x="95" y="178" width="170" height="14" rx="4" fill="#ffb454"/>
    <rect x="95" y="210" width="250" height="8" rx="4" fill="#6b5a46"/>
    <rect x="95" y="230" width="230" height="8" rx="4" fill="#6b5a46"/>
    <rect x="95" y="250" width="250" height="8" rx="4" fill="#6b5a46"/>
    <rect x="95" y="270" width="190" height="8" rx="4" fill="#6b5a46"/>
    <rect x="95" y="320" width="250" height="140" rx="10" fill="#0f2a28" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="220" y="360" font-size="18" text-anchor="middle" fill="#2dd4bf">giscus</text>
    <rect x="115" y="380" width="210" height="14" rx="4" fill="#2dd4bf" opacity="0.55"/>
    <rect x="115" y="404" width="160" height="14" rx="4" fill="#2dd4bf" opacity="0.35"/>
    <rect x="115" y="428" width="190" height="14" rx="4" fill="#2dd4bf" opacity="0.35"/>
    <text x="220" y="528" font-size="22" text-anchor="middle">Blog post</text>
    <!-- arrows -->
    <path d="M385 400 H 505" stroke="#ffb454" stroke-width="4" fill="none" marker-end="url(#ah)"/>
    <path d="M505 430 H 385" stroke="#2dd4bf" stroke-width="4" fill="none" marker-end="url(#ah)" opacity="0.8"/>
    <!-- giscus app -->
    <circle cx="610" cy="400" r="88" fill="#0f2a28" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M565 372 h90 a10 10 0 0 1 10 10 v40 a10 10 0 0 1 -10 10 h-50 l-24 20 v-20 h-16 a10 10 0 0 1 -10 -10 v-40 a10 10 0 0 1 10 -10 z" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="590" cy="402" r="5" fill="#2dd4bf"/><circle cx="610" cy="402" r="5" fill="#2dd4bf"/><circle cx="630" cy="402" r="5" fill="#2dd4bf"/>
    <text x="610" y="528" font-size="22" text-anchor="middle">giscus app</text>
    <path d="M705 400 H 825" stroke="#ffb454" stroke-width="4" fill="none" marker-end="url(#ah)"/>
    <path d="M825 430 H 705" stroke="#2dd4bf" stroke-width="4" fill="none" marker-end="url(#ah)" opacity="0.8"/>
    <!-- GitHub discussions -->
    <rect x="840" y="150" width="290" height="340" rx="14" fill="#241810" stroke="#ffb454" stroke-width="3"/>
    <text x="985" y="195" font-size="20" text-anchor="middle" fill="#ffb454">Discussions</text>
    <rect x="865" y="225" width="240" height="64" rx="8" fill="#33241a" stroke="#6b5a46"/>
    <rect x="865" y="305" width="240" height="64" rx="8" fill="#33241a" stroke="#6b5a46"/>
    <rect x="865" y="385" width="240" height="64" rx="8" fill="#33241a" stroke="#6b5a46"/>
    <rect x="880" y="245" width="140" height="8" rx="4" fill="#ffb454"/><rect x="880" y="263" width="190" height="6" rx="3" fill="#6b5a46"/>
    <rect x="880" y="325" width="120" height="8" rx="4" fill="#ffb454"/><rect x="880" y="343" width="170" height="6" rx="3" fill="#6b5a46"/>
    <rect x="880" y="405" width="150" height="8" rx="4" fill="#ffb454"/><rect x="880" y="423" width="140" height="6" rx="3" fill="#6b5a46"/>
    <text x="985" y="528" font-size="22" text-anchor="middle">GitHub repo</text>
    <text x="600" y="90" font-size="34" font-weight="bold" text-anchor="middle" fill="#ffb454">Comments with giscus</text>
    <text x="600" y="582" font-size="18" text-anchor="middle" fill="#a8977f">one page = one discussion</text>
  </g>
</svg>
