<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Statistics powers machine learning, AI and robotics</title>
  <desc id="d">A bell curve labelled Statistics on the left feeds three cards. Machine learning shows a scatter of points with a fitted line. AI shows a small network of connected nodes. Robotics shows a noisy path with a smooth estimate through it.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0f16"/><stop offset="1" stop-color="#2a1420"/></linearGradient></defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#5a2a3c"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#fbeaf0" text-anchor="middle">
    <!-- statistics: bell curve -->
    <path d="M36 250 C80 250 90 240 105 200 C118 160 130 100 150 100 C170 100 182 160 195 200 C210 240 220 250 264 250" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round"/>
    <path d="M105 200 C118 160 130 100 150 100 C170 100 182 160 195 200 Z" fill="#a3e635" opacity=".18"/>
    <line x1="36" y1="250" x2="264" y2="250" stroke="#a3e635" stroke-width="2" opacity=".6"/>
    <line x1="150" y1="100" x2="150" y2="250" stroke="#a3e635" stroke-width="2" stroke-dasharray="5 5" opacity=".6"/>
    <text x="150" y="288" font-size="24" fill="#a3e635" font-weight="bold">Statistics</text>
    <text x="150" y="312" font-size="13">noise, signal, uncertainty</text>
    <!-- arrows -->
    <g stroke="#fb7185" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M278 150 H316"/><path d="M308 142 L318 150 L308 158"/>
      <path d="M278 200 H316"/><path d="M308 192 L318 200 L308 208"/>
      <path d="M278 250 H316"/><path d="M308 242 L318 250 L308 258"/>
    </g>
    <!-- ML card -->
    <rect x="332" y="60" width="170" height="250" rx="14" fill="#14090f" stroke="#fb7185" stroke-width="3"/>
    <g fill="#fb7185"><circle cx="366" cy="170" r="5"/><circle cx="390" cy="150" r="5"/><circle cx="410" cy="158" r="5"/><circle cx="432" cy="128" r="5"/><circle cx="452" cy="132" r="5"/><circle cx="474" cy="104" r="5"/></g>
    <line x1="356" y1="178" x2="484" y2="100" stroke="#a3e635" stroke-width="3" stroke-linecap="round"/>
    <text x="417" y="232" font-size="21" fill="#fb7185" font-weight="bold">ML</text>
    <text x="417" y="258" font-size="13">fit a model</text>
    <text x="417" y="278" font-size="13">to noisy data</text>
    <!-- AI card -->
    <rect x="515" y="60" width="170" height="250" rx="14" fill="#14090f" stroke="#fb7185" stroke-width="3"/>
    <g stroke="#a3e635" stroke-width="2.5"><line x1="600" y1="100" x2="556" y2="150"/><line x1="600" y1="100" x2="644" y2="150"/><line x1="556" y1="150" x2="578" y2="190"/><line x1="644" y1="150" x2="622" y2="190"/><line x1="556" y1="150" x2="622" y2="190"/></g>
    <g fill="#14090f" stroke="#fb7185" stroke-width="3"><circle cx="600" cy="100" r="12"/><circle cx="556" cy="150" r="12"/><circle cx="644" cy="150" r="12"/><circle cx="578" cy="190" r="12"/><circle cx="622" cy="190" r="12"/></g>
    <text x="600" y="232" font-size="21" fill="#fb7185" font-weight="bold">AI</text>
    <text x="600" y="258" font-size="13">reason when</text>
    <text x="600" y="278" font-size="13">nothing is certain</text>
    <!-- Robotics card -->
    <rect x="698" y="60" width="170" height="250" rx="14" fill="#14090f" stroke="#fb7185" stroke-width="3"/>
    <polyline points="722,180 742,150 760,170 780,126 800,150 820,106 842,128" fill="none" stroke="#fb7185" stroke-width="2.5" opacity=".7"/>
    <path d="M722 172 C750 160 770 146 790 138 C810 126 826 118 842 112" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>
    <text x="783" y="232" font-size="21" fill="#fb7185" font-weight="bold">Robotics</text>
    <text x="783" y="258" font-size="13">filter noisy sensors,</text>
    <text x="783" y="278" font-size="13">estimate the state</text>
  </g>
</svg>
