<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>An RGB colour as three sliders from 0 to 255</title>
  <desc>Three sliders set red to 64, green to 196 and blue to 170, which mix into a teal swatch, rgb(64, 196, 170).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c141d"/><stop offset="1" stop-color="#131f2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="110" y="62" text-anchor="middle" fill="#8aa0b4" font-size="15">0</text>
  <text x="490" y="62" text-anchor="middle" fill="#8aa0b4" font-size="15">255</text>
  <text x="60" y="109" fill="#ff5d5d" font-size="26" font-weight="bold">R</text>
  <rect x="110" y="94" width="380" height="22" rx="11" fill="#1d2a38"/>
  <rect x="110" y="94" width="95.4" height="22" rx="11" fill="#ff5d5d"/>
  <circle cx="205.4" cy="105" r="15" fill="#f4f7fa" stroke="#ff5d5d" stroke-width="4"/>
  <text x="520" y="110" fill="#e6edf3" font-size="22">64</text>
  <text x="60" y="179" fill="#4ade80" font-size="26" font-weight="bold">G</text>
  <rect x="110" y="164" width="380" height="22" rx="11" fill="#1d2a38"/>
  <rect x="110" y="164" width="292.1" height="22" rx="11" fill="#4ade80"/>
  <circle cx="402.1" cy="175" r="15" fill="#f4f7fa" stroke="#4ade80" stroke-width="4"/>
  <text x="520" y="180" fill="#e6edf3" font-size="22">196</text>
  <text x="60" y="249" fill="#60a5fa" font-size="26" font-weight="bold">B</text>
  <rect x="110" y="234" width="380" height="22" rx="11" fill="#1d2a38"/>
  <rect x="110" y="234" width="253.3" height="22" rx="11" fill="#60a5fa"/>
  <circle cx="363.3" cy="245" r="15" fill="#f4f7fa" stroke="#60a5fa" stroke-width="4"/>
  <text x="520" y="250" fill="#e6edf3" font-size="22">170</text>
  <rect x="580" y="90" width="170" height="170" rx="16" fill="#40C4AA" stroke="#f4f7fa" stroke-width="3"/>
  <text x="665" y="290" text-anchor="middle" fill="#e6edf3" font-size="14">mixed colour</text>
  <rect x="120" y="318" width="560" height="56" rx="10" fill="#0c141d" stroke="#8aa0b4" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="bold">rgb(64, 196, 170)</text>
</svg>
