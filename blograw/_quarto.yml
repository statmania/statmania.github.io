project:
  type: website
  render:
    - "*.qmd"
    - "posts/*.qmd"
    - "authors/*.qmd"
  output-dir: ../blog
  pre-render: _extensions/blogkit/build_site_data.py

website:
  title: "Stat Mania"
  description: "Posts on statistics theory, R & Python, and developer tips from Stat Mania."
  site-url: "https://www.statmania.info/blog/"
  open-graph:
    image: logo.png
  twitter-card:
    image: logo.png
  google-analytics:
    tracking-id: "G-BEELJ2ZRED"
  navbar:
    background: light
    logo: logo.svg
    logo-alt: "Stat Mania Logo."
    left:
      - href: index.qmd
        text: Home
      - href: "https://www.statmania.info"
        text: Portal
    right:
      - about.qmd
      - icon: twitter
        href: https://twitter.com
format:
  blogkit-html:
    # the extension supplies the theme, styles.css, code-reveal and its scripts;
    # site.css holds the Stat Mania overrides (starfield, hero, dark bands)
    css: site.css
    include-after-body:
      - ../starfield-include.html
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
