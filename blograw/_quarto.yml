project:
  type: website
  render:
    - "*.qmd"
    - "posts/*.qmd"
    - "authors/*.qmd"
  output-dir: ../blog
  pre-render: scripts/build_site_data.py

website:
  title: "Stat Mania"
  description: "Posts on statistics theory, R & Python, and developer tips from Stat Mania."
  site-url: "https://www.statmania.info/blog/"
  open-graph:
    image: logo.png
  twitter-card:
    image: logo.png
  google-analytics:
    tracking-id: "G-BEELJ2ZRED"
  navbar:
    background: light
    logo: logo.svg
    logo-alt: "Stat Mania Logo."
    left:
      - href: index.qmd
        text: Home
      - href: "https://www.statmania.info"
        text: Portal
    right:
      - about.qmd
      - icon: twitter
        href: https://twitter.com
format:
  html:
    # dark is listed first so it is the default; the navbar gets a light/dark toggle
    theme:
      dark: [cosmo, theme-dark.scss]
      light: cosmo
    css: styles.css
    highlight-style:
      light: github
      dark: dracula
    include-after-body:
      - ../starfield-include.html
      - code-reveal.html
      - _site-include.html
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



