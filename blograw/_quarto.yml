project:
  type: website
  render:
    - "*.qmd"
    - "posts/*.qmd"
    - "authors/*.qmd"
  output-dir: ../blog
  pre-render: _extensions/blogkit/build_site_data.py
  post-render:
    - _extensions/blogkit/repair_index.py
    - fix_feed_math.py

# hide R messages and warnings (e.g. the tidyverse attach/conflicts banner): readers see only the output
knitr:
  opts_chunk:
    message: false
    warning: false

blogkit:
  hero-tagline: "Tutorials, theory and dev notes on statistics, mathematics, Linux, C, R, and Python."

website:
  title: "Stat Mania"
  description: "Posts on statistics theory, R & Python, and developer tips from Stat Mania."
  site-url: "https://www.statmania.info/blog/"
  open-graph:
    image: logo.png
  twitter-card:
    image: logo.png
  google-analytics:
    tracking-id: "G-BEELJ2ZRED"
  navbar:
    background: light
    logo: logo.svg
    logo-alt: "Stat Mania Logo."
    left:
      - href: index.qmd
        text: Home
        icon: "house"
      - href: tags.qmd
        text: Tags
        icon: "tags"
      - href: categories.qmd
        text: Categories
        icon: "collection"
      - text: Language
        icon: "code-slash"
        menu:
          - text: R
            href: "tags.html#tag=r"
            icon: "bar-chart-line"
          - text: C
            href: "tags.html#tag=c"
            icon: "braces"
          - text: Python
            href: "tags.html#tag=python"
            icon: "filetype-py"
          - text: Shell
            href: "tags.html#tag=command-line"
            icon: "terminal"
      - href: "https://www.statmania.info"
        text: Portal
        icon: "globe"
    right:
      - href: about.qmd
        text: About
        icon: "info-circle"
      - icon: twitter
        href: https://twitter.com
  page-footer:
    left: |
      © 2026 Stat Mania

      Made with [Quarto](https://quarto.org) using the custom template [blogkit](https://github.com/statmania/quarto-blogkit) by [Stat Mania](https://www.statmania.info)
    center:
      - text: "Tags"
        href: tags.qmd
      - text: "Categories"
        href: categories.qmd
      - text: "About"
        href: about.qmd
      - text: "Portal"
        href: "https://www.statmania.info"
      - text: "RSS"
        href: index.xml

format:
  blogkit-html:
    # the extension supplies the theme, styles.css, code-reveal and its scripts;
    # site.css holds the Stat Mania overrides (starfield, hero, dark bands)
    css: site.css
    include-after-body:
      - ../starfield-include.html
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
