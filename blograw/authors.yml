# Author profiles. The key is the slug used in the URL (authors/<slug>.html).
# A post belongs to an author when its front-matter `author:` equals `name`
# (or one of `aliases`), so existing posts need no changes.
# `image` is relative to blograw/ (a square-ish photo; it is cropped to a circle).
# Edit this file, then run a normal `quarto render`: the pre-render hook
# (scripts/build_widgets.py) rebuilds every authors/<slug>.qmd and the byline links.
abdullah-al-mahmud:
  name: Abdullah Al Mahmud
  aliases: []
  image: img/abdullah.jpeg
  tagline: Statistics teacher, writer and Quarto tinkerer
  bio: >-
    I teach statistics and write about it, along with R, Python, C and the
    tools around them. I build my own teaching slides with code and have
    written six science books under the pen name Abdullah Adil Mahmud.
  links:
    - {text: Website, href: "https://www.thinkermahmud.com/"}
    - {text: Twitter, href: "https://x.com/thinkermahmud"}
    - {text: LinkedIn, href: "https://www.linkedin.com/in/mahmudstat/"}
