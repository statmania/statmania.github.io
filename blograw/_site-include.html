<script>
/* Loads the blog's dynamic widgets (site.js) from the blog root, whatever the page depth. */
(function () {
  var css = document.querySelector('link[rel="stylesheet"][href$="styles.css"]');
  var base = css ? css.getAttribute('href').slice(0, -'styles.css'.length) : '';
  var s = document.createElement('script');
  s.src = base + 'site.js';
  s.dataset.base = base;
  document.body.appendChild(s);
})();
</script>
