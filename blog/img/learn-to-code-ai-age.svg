<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Why learn to code in the AI age</title>
  <desc id="d">Three cards. The first, Emergency, shows an alert triangle and the words when the AI is not available. The second, Save tokens, shows a token meter with a small edit done by hand. The third, Fundamentals, shows a stack of layers: code, runtime, operating system, hardware.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14102e"/><stop offset="1" stop-color="#1f1747"/></linearGradient></defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#3b2f7a"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#f1ecff" text-anchor="middle">
    <text x="450" y="46" font-size="22" fill="#c4b5fd">Why still learn to code?</text>

    <rect x="36" y="76" width="262" height="250" rx="14" fill="#0e0a24" stroke="#f472b6" stroke-width="3"/>
    <path d="M167 112 L205 176 H129 Z" fill="none" stroke="#f472b6" stroke-width="5" stroke-linejoin="round"/>
    <rect x="164" y="132" width="6" height="24" rx="3" fill="#f472b6"/><circle cx="167" cy="166" r="4" fill="#f472b6"/>
    <text x="167" y="226" font-size="22" fill="#f472b6" font-weight="bold">Emergency</text>
    <text x="167" y="256" font-size="14">AI offline, limit hit,</text>
    <text x="167" y="278" font-size="14">server down at 2 a.m.</text>
    <text x="167" y="304" font-size="14" fill="#c4b5fd">we fix it ourselves</text>

    <rect x="319" y="76" width="262" height="250" rx="14" fill="#0e0a24" stroke="#a78bfa" stroke-width="3"/>
    <rect x="379" y="112" width="142" height="22" rx="11" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <rect x="384" y="117" width="98" height="12" rx="6" fill="#a78bfa"/>
    <text x="450" y="166" font-size="13" fill="#c4b5fd">tokens</text>
    <text x="450" y="196" font-size="17"><tspan fill="#f472b6">N=10</tspan><tspan dx="8"> to </tspan><tspan dx="8" fill="#34d399">N=20</tspan></text>
    <text x="450" y="226" font-size="22" fill="#a78bfa" font-weight="bold">Save tokens</text>
    <text x="450" y="256" font-size="14">tiny edits by hand,</text>
    <text x="450" y="278" font-size="14">AI for the big work</text>

    <rect x="602" y="76" width="262" height="250" rx="14" fill="#0e0a24" stroke="#34d399" stroke-width="3"/>
    <rect x="662" y="108" width="142" height="22" rx="5" fill="#34d399" opacity=".95"/><text x="733" y="124" font-size="13" fill="#0e0a24">your code</text>
    <rect x="662" y="134" width="142" height="22" rx="5" fill="#34d399" opacity=".7"/><text x="733" y="150" font-size="13" fill="#0e0a24">runtime / libraries</text>
    <rect x="662" y="160" width="142" height="22" rx="5" fill="#34d399" opacity=".5"/><text x="733" y="176" font-size="13" fill="#0e0a24">operating system</text>
    <rect x="662" y="186" width="142" height="22" rx="5" fill="#34d399" opacity=".35"/><text x="733" y="202" font-size="13" fill="#f1ecff">hardware</text>
    <text x="733" y="244" font-size="22" fill="#34d399" font-weight="bold">Fundamentals</text>
    <text x="733" y="272" font-size="14">know how the system</text>
    <text x="733" y="294" font-size="14">works underneath</text>
  </g>
</svg>
