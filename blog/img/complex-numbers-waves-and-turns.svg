<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>A boatman's journey as complex numbers</title>
<desc>A boat travels 4 km east, turns left 60 degrees and goes 3 km, then turns left 45 degrees more and goes 2 km. The straight line from start to finish, 6.73 km at 42 degrees, is the sum of the three legs.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a0c"/><stop offset="1" stop-color="#1c2b17"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="48" font-size="25" fill="#7dd3fc" font-weight="bold">a turn is a multiplication</text>
<polyline points="130.0,330.0 310.0,330.0 377.5,213.1 354.2,126.1" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linejoin="round"/>
<line x1="130" y1="330" x2="354.2" y2="126.1" stroke="#fb7185" stroke-width="4" stroke-dasharray="9 7"/>
<circle cx="130" cy="330" r="8" fill="#fbbf24"/>
<circle cx="354.2" cy="126.1" r="9" fill="#fb7185"/>
<text x="118" y="336" font-size="15" fill="#fbbf24" text-anchor="end">start</text>
<text x="220" y="358" font-size="16" fill="#7dd3fc">4 km east</text>
<text x="394" y="285" font-size="16" fill="#7dd3fc" text-anchor="start">3 km, turn 60°</text>
<text x="376" y="170" font-size="16" fill="#7dd3fc" text-anchor="start">2 km, turn 45° more</text>
<text x="150" y="150" font-size="16" fill="#fb7185" text-anchor="start">6.73 km at 42°</text>
<g font-size="17" text-anchor="start" fill="#e6f4dc"><text x="480" y="335">4 + 3e<tspan dy="-7" font-size="12">i60°</tspan><tspan dy="7"></tspan> + 2e<tspan dy="-7" font-size="12">i105°</tspan><tspan dy="7"></tspan></text><text x="480" y="365" fill="#fb7185" font-weight="bold">= 4.98 + 4.53i</text></g><g font-size="15" fill="#c9dcc0"><text x="400" y="394">A boatman rows 4 km east, turns left 60° and rows 3 km,</text><text x="400" y="414">then turns 45° more and rows 2 km. The legs add up to 4.98 + 4.53i.</text></g>
</g></svg>