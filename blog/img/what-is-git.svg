<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Git as a timeline of save points with a branch and a merge</title>
  <desc id="d">A horizontal main timeline of four commits. A second branch splits off after the second commit, holds two commits of its own, and merges back into the main line. A small undo arrow points back along the timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1210"/>
      <stop offset="1" stop-color="#2b1a14"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fdf0e6"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#4a2c20"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#fdf0e6">
    <text x="450" y="52" font-size="26" text-anchor="middle" fill="#fb923c">A time machine for your files</text>

    <!-- main line -->
    <path d="M90 230 H810" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <!-- branch out and merge back -->
    <path d="M270 230 C310 230 320 130 370 130 H530 C580 130 590 230 630 230" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>

    <!-- main commits -->
    <g fill="#2b1a14" stroke="#fb923c" stroke-width="5">
      <circle cx="90" cy="230" r="15"/>
      <circle cx="270" cy="230" r="15"/>
      <circle cx="630" cy="230" r="15"/>
      <circle cx="810" cy="230" r="15"/>
    </g>
    <!-- branch commits -->
    <g fill="#2b1a14" stroke="#2dd4bf" stroke-width="5">
      <circle cx="405" cy="130" r="15"/>
      <circle cx="495" cy="130" r="15"/>
    </g>

    <g font-size="15" text-anchor="middle">
      <text x="90" y="272" fill="#fb923c">Add</text><text x="90" y="292" fill="#fb923c">chapter 1</text>
      <text x="270" y="272" fill="#fb923c">Add</text><text x="270" y="292" fill="#fb923c">dragons</text>
      <text x="630" y="272" fill="#fb923c">Merge</text><text x="630" y="292" fill="#fb923c">branch</text>
      <text x="810" y="272" fill="#fb923c">Fix</text><text x="810" y="292" fill="#fb923c">typo</text>
      <text x="405" y="98" fill="#2dd4bf">Kill the</text><text x="405" y="170" fill="#2dd4bf">knight</text>
      <text x="495" y="98" fill="#2dd4bf">Rewrite</text><text x="495" y="170" fill="#2dd4bf">ending</text>
    </g>

    <g font-size="17">
      <text x="110" y="130" fill="#2dd4bf" opacity=".9">branch: parallel draft</text>
      <text x="810" y="200" fill="#fb923c" text-anchor="middle" opacity=".9">main</text>
    </g>

    <!-- undo arrow -->
    <path d="M790 312 C600 326 300 326 110 312" fill="none" stroke="#fdf0e6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#ar)" opacity=".7"/>
    <text x="450" y="348" font-size="15" text-anchor="middle" opacity=".7">undo: go back to any save point</text>
  </g>
</svg>
