<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">A ruler versus a queue of people</title>
  <desc id="d">Left: letters A to E stand on a ruler marked 0 to 4, with x[0] and a plus-two-steps arrow, showing zero-based indexing as distance from the start. Right: five people queue up wearing badges 1 to 5, with x[1] above, showing one-based indexing as position in the line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07170f"/><stop offset="1" stop-color="#10261a"/></linearGradient>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1f4a30"/>
  <line x1="450" y1="30" x2="450" y2="270" stroke="#2c5a3f" stroke-width="2" stroke-dasharray="6 8"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-weight="700">
    <!-- scattered code -->
    <text x="95" y="62" font-size="34" fill="#4ade80">x[0]</text>
    <text x="260" y="40" font-size="15" fill="#2f7a4d" transform="rotate(-6 260 40)">*(a + 2)</text>
    <text x="250" y="86" font-size="14" fill="#2f7a4d">i &lt; n</text>
    <text x="560" y="62" font-size="34" fill="#fbbf24">x[1]</text>
    <text x="790" y="92" font-size="15" fill="#8a6a1a">1:0 ?!</text>
    <text x="700" y="46" font-size="14" fill="#8a6a1a">seq_along()</text>
    <!-- C hexagon -->
    <path d="M345,34 l20,-12 l20,12 v24 l-20,12 l-20,-12 z" fill="#0b1f14" stroke="#4ade80" stroke-width="2.5"/>
    <text x="365" y="56" font-size="22" fill="#dcfce7">C</text>
    <!-- R hexagon -->
    <path d="M825,34 l20,-12 l20,12 v24 l-20,12 l-20,-12 z" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="845" y="56" font-size="22" fill="#fef3c7">R</text>
    <!-- ruler -->
    <rect x="46" y="190" width="392" height="46" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2.5"/>
    <line x1="56" y1="190" x2="56" y2="214" stroke="#bbf7d0" stroke-width="3"/>
    <text x="66" y="228" font-size="18" fill="#bbf7d0" text-anchor="start">0</text>
    <rect x="59" y="120" width="70" height="62" rx="10" fill="#0b1f14" stroke="#4ade80" stroke-width="2.5"/>
    <text x="94" y="162" font-size="28" fill="#dcfce7">A</text>
    <line x1="132" y1="190" x2="132" y2="214" stroke="#bbf7d0" stroke-width="3"/>
    <text x="142" y="228" font-size="18" fill="#bbf7d0" text-anchor="start">1</text>
    <rect x="135" y="120" width="70" height="62" rx="10" fill="#0b1f14" stroke="#4ade80" stroke-width="2.5"/>
    <text x="170" y="162" font-size="28" fill="#dcfce7">B</text>
    <line x1="208" y1="190" x2="208" y2="214" stroke="#bbf7d0" stroke-width="3"/>
    <text x="218" y="228" font-size="18" fill="#bbf7d0" text-anchor="start">2</text>
    <rect x="211" y="120" width="70" height="62" rx="10" fill="#0b1f14" stroke="#4ade80" stroke-width="2.5"/>
    <text x="246" y="162" font-size="28" fill="#dcfce7">C</text>
    <line x1="284" y1="190" x2="284" y2="214" stroke="#bbf7d0" stroke-width="3"/>
    <text x="294" y="228" font-size="18" fill="#bbf7d0" text-anchor="start">3</text>
    <rect x="287" y="120" width="70" height="62" rx="10" fill="#0b1f14" stroke="#4ade80" stroke-width="2.5"/>
    <text x="322" y="162" font-size="28" fill="#dcfce7">D</text>
    <line x1="360" y1="190" x2="360" y2="214" stroke="#bbf7d0" stroke-width="3"/>
    <text x="370" y="228" font-size="18" fill="#bbf7d0" text-anchor="start">4</text>
    <rect x="363" y="120" width="70" height="62" rx="10" fill="#0b1f14" stroke="#4ade80" stroke-width="2.5"/>
    <text x="398" y="162" font-size="28" fill="#dcfce7">E</text>
    <path d="M58,254 Q133,282 208,254" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="300" y="266" font-size="15" fill="#86efac" font-weight="400">2 steps from the start</text>
    <!-- queue -->
    <line x1="470" y1="236" x2="870" y2="236" stroke="#8a6a1a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="505" cy="106" r="15" fill="#fbbf24"/><text x="505" y="112" font-size="17" fill="#1f1708">1</text>
    <circle cx="505" cy="150" r="16" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="485" y="172" width="40" height="52" rx="14" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="505" y="206" font-size="22" fill="#fef3c7">A</text>
    <line x1="496" y1="224" x2="496" y2="236" stroke="#fbbf24" stroke-width="3"/><line x1="514" y1="224" x2="514" y2="236" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="581" cy="106" r="15" fill="#fbbf24"/><text x="581" y="112" font-size="17" fill="#1f1708">2</text>
    <circle cx="581" cy="150" r="16" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="561" y="172" width="40" height="52" rx="14" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="581" y="206" font-size="22" fill="#fef3c7">B</text>
    <line x1="572" y1="224" x2="572" y2="236" stroke="#fbbf24" stroke-width="3"/><line x1="590" y1="224" x2="590" y2="236" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="657" cy="106" r="15" fill="#fbbf24"/><text x="657" y="112" font-size="17" fill="#1f1708">3</text>
    <circle cx="657" cy="150" r="16" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="637" y="172" width="40" height="52" rx="14" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="657" y="206" font-size="22" fill="#fef3c7">C</text>
    <line x1="648" y1="224" x2="648" y2="236" stroke="#fbbf24" stroke-width="3"/><line x1="666" y1="224" x2="666" y2="236" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="733" cy="106" r="15" fill="#fbbf24"/><text x="733" y="112" font-size="17" fill="#1f1708">4</text>
    <circle cx="733" cy="150" r="16" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="713" y="172" width="40" height="52" rx="14" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="733" y="206" font-size="22" fill="#fef3c7">D</text>
    <line x1="724" y1="224" x2="724" y2="236" stroke="#fbbf24" stroke-width="3"/><line x1="742" y1="224" x2="742" y2="236" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="809" cy="106" r="15" fill="#fbbf24"/><text x="809" y="112" font-size="17" fill="#1f1708">5</text>
    <circle cx="809" cy="150" r="16" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="789" y="172" width="40" height="52" rx="14" fill="#1f1708" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="809" y="206" font-size="22" fill="#fef3c7">E</text>
    <line x1="800" y1="224" x2="800" y2="236" stroke="#fbbf24" stroke-width="3"/><line x1="818" y1="224" x2="818" y2="236" stroke="#fbbf24" stroke-width="3"/>
    <text x="670" y="266" font-size="15" fill="#fcd34d" font-weight="400">which one in the line?</text>
    <circle cx="450" cy="40" r="20" fill="#10261a" stroke="#2c5a3f" stroke-width="2"/>
    <text x="450" y="46" font-size="16" fill="#86efac">vs</text>
  </g>
</svg>
