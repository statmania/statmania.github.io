<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">An array with unset slots</title>
  <desc id="d">An array of ten int slots. Slot 0 is never written and holds leftover garbage, slots 1 and 2 hold 10 and 13, and slots 3 to 9 are unset.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#14100a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#26303d"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <text x="450" y="42" font-size="19">int FixedArr[10];   FixedArr[1] = 10;   FixedArr[2] = 13;</text>
    <rect x="40" y="62" width="162" height="34" rx="8" fill="#2a1118" stroke="#fb7185" stroke-width="2"/>
    <text x="121" y="85" font-size="15" fill="#fb7185">never written</text>
    <path d="M121 96 V134" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>
