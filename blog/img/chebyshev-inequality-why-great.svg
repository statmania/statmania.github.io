<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>Chebyshev's inequality holds for every distribution shape</title>
  <desc>Three distributions side by side: bell-shaped, right-skewed and U-shaped. In each, the shaded band covers the mean plus and minus two standard deviations, and at least 75% of the data always lie inside it, whatever the shape.</desc>
