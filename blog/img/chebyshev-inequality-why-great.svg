    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f2a"/><stop offset="1" stop-color="#08141c"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0.15"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="44" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="22" font-weight="700" fill="#fb923c">Chebyshev's inequality</text>
  <text x="400" y="72" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#e2f4f1">Whatever the shape, at least 75% of the data</text>
  <text x="400" y="94" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#e2f4f1">lie within 2 standard deviations of the mean</text>
