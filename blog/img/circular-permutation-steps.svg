<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" role="img" aria-labelledby="t d">
  <title id="t">Seating men first and then women</title>
  <desc id="d">Left: four men sit in alternate seats with M1 fixed, giving 6 ways. Right: the four gaps between them offer 4, 3, 2 and 1 choices to the women, giving 24 ways.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#230f27"/>
      <stop offset="1" stop-color="#150c1d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="435" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="433" rx="17" fill="none" stroke="#4a2a50"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<text x="230.0" y="42.0" font-size="25" fill="#fcd34d" text-anchor="middle" font-weight="normal">1. Seat the men</text>
<text x="670.0" y="42.0" font-size="25" fill="#fcd34d" text-anchor="middle" font-weight="normal">2. Seat the women</text>
<circle cx="230.0" cy="195.0" r="108" fill="none" stroke="#6b4a70" stroke-width="2"/><circle cx="230.0" cy="87.0" r="25" fill="#ff7a30" stroke="#ffb380" stroke-width="2.5"/><text x="230.0" y="96.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M1</text><circle cx="306.4" cy="118.6" r="25" fill="none" stroke="#c3a6c0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="306.4" y="128.1" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold"></text><circle cx="338.0" cy="195.0" r="25" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="338.0" y="204.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M2</text><circle cx="306.4" cy="271.4" r="25" fill="none" stroke="#c3a6c0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="306.4" y="280.9" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold"></text><circle cx="230.0" cy="303.0" r="25" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="230.0" y="312.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M3</text><circle cx="153.6" cy="271.4" r="25" fill="none" stroke="#c3a6c0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="153.6" y="280.9" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold"></text><circle cx="122.0" cy="195.0" r="25" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="122.0" y="204.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M4</text><circle cx="153.6" cy="118.6" r="25" fill="none" stroke="#c3a6c0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="153.6" y="128.1" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold"></text>
<circle cx="670.0" cy="195.0" r="108" fill="none" stroke="#6b4a70" stroke-width="2"/><circle cx="670.0" cy="87.0" r="25" fill="#ff7a30" stroke="#ffb380" stroke-width="2.5"/><text x="670.0" y="96.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M1</text><circle cx="746.4" cy="118.6" r="25" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="5 4"/><text x="746.4" y="128.1" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">4</text><circle cx="778.0" cy="195.0" r="25" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="778.0" y="204.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M2</text><circle cx="746.4" cy="271.4" r="25" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="5 4"/><text x="746.4" y="280.9" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">3</text><circle cx="670.0" cy="303.0" r="25" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="670.0" y="312.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M3</text><circle cx="593.6" cy="271.4" r="25" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="5 4"/><text x="593.6" y="280.9" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">2</text><circle cx="562.0" cy="195.0" r="25" fill="#12403c" stroke="#5eead4" stroke-width="2.5"/><text x="562.0" y="204.5" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">M4</text><circle cx="593.6" cy="118.6" r="25" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="5 4"/><text x="593.6" y="128.1" font-size="28" fill="#f6eaf4" text-anchor="middle" font-weight="bold">1</text>
<text x="230.0" y="203.0" font-size="26" fill="#5eead4" text-anchor="middle" font-weight="normal">3! = 6</text>
<text x="670.0" y="203.0" font-size="26" fill="#5eead4" text-anchor="middle" font-weight="normal">4! = 24</text>
<text x="230.0" y="352.0" font-size="20" fill="#c3a6c0" text-anchor="middle" font-weight="normal">M1 fixed, 3 to arrange</text>
<text x="670.0" y="352.0" font-size="20" fill="#c3a6c0" text-anchor="middle" font-weight="normal">choices for each gap</text>
<path d="M450 30 V365" stroke="#4a2a50" stroke-width="2"/>
<text x="450.0" y="407.0" font-size="26" fill="#f6eaf4" text-anchor="middle" font-weight="normal">total: 6 × 24 = 144</text>
  </g>
</svg>
