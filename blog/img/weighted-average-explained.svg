<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Centre of gravity of a uniform bar and of a hammer</title>
<desc>On the left a uniform bar balances at its midpoint. On the right a hammer, heavy at one end, balances near its head, away from the midpoint, just as a weighted average shifts toward heavier values.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07150f"/><stop offset="1" stop-color="#10261b"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="50" font-size="26" fill="#f5b942" font-weight="bold">weights move the average</text>
<line x1="400" y1="85" x2="400" y2="385" stroke="#9be7b0" stroke-opacity=".3" stroke-dasharray="5 6"/>
<!-- uniform bar -->
<rect x="50" y="198" width="300" height="26" rx="5" fill="#9be7b0"/>
<polygon points="200,226 184,262 216,262" fill="#38bdf8"/>
<text x="200" y="292" font-size="19" fill="#38bdf8" font-weight="bold">balance = midpoint</text>
<text x="200" y="130" font-size="19" fill="#d6f5df">equal weights</text>
<text x="200" y="158" font-size="16" fill="#9be7b0">simple mean</text>
<!-- hammer -->
<rect x="450" y="169" width="64" height="84" rx="8" fill="#f5b942"/>
<rect x="514" y="203" width="266" height="16" rx="4" fill="#9be7b0"/>
<line x1="647" y1="188" x2="647" y2="234" stroke="#d6f5df" stroke-dasharray="4 4"/>
<text x="647" y="180" font-size="14" fill="#d6f5df">midpoint</text>
<polygon points="520,256 504,292 536,292" fill="#38bdf8"/>
<text x="560" y="322" font-size="19" fill="#38bdf8" font-weight="bold">balance shifts to the head</text>
<text x="615" y="130" font-size="19" fill="#d6f5df">unequal weights</text>
<text x="615" y="158" font-size="16" fill="#f5b942">weighted mean</text>
</g></svg>
