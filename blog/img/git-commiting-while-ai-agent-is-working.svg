<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Git commits while an AI agent works</title>
<desc>A main branch of commits, with a separate agent branch in its own worktree that is merged back once the work is finished and reviewed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1430"/><stop offset="1" stop-color="#1c1024"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="600" y="95" text-anchor="middle" font-size="38" font-weight="bold" fill="#ffd2a8">Let the agent finish, then commit</text>
<g stroke-width="5" fill="none" stroke-linecap="round">
<path d="M120 250 H1080" stroke="#5ec2ff"/>
<path d="M360 250 C420 250 420 430 480 430 H780 C840 430 840 250 900 250" stroke="#ff8a5c" stroke-dasharray="2 12"/>
</g>
<g fill="#5ec2ff"><circle cx="120" cy="250" r="16"/><circle cx="240" cy="250" r="16"/><circle cx="360" cy="250" r="16"/><circle cx="900" cy="250" r="16"/><circle cx="1020" cy="250" r="16"/></g>
<g fill="#ff8a5c" opacity=".9"><circle cx="520" cy="430" r="11" fill="none" stroke="#ff8a5c" stroke-width="4"/><circle cx="620" cy="430" r="11" fill="none" stroke="#ff8a5c" stroke-width="4"/><circle cx="720" cy="430" r="11" fill="none" stroke="#ff8a5c" stroke-width="4"/></g>
<text x="120" y="205" font-size="24" fill="#5ec2ff">main</text>
<text x="520" y="485" font-size="24" fill="#ff8a5c">agent worktree: edits in progress</text>
<text x="820" y="205" font-size="24" fill="#ffd2a8">review + test + commit</text>
<text x="600" y="570" text-anchor="middle" font-size="26" fill="#f3e6ff">git worktree add ../agent -b agent/task</text>
</svg>