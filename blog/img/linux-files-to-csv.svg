<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">From folders to a CSV file to selected files</title>
  <desc id="d">Event folders on the left are listed into output.csv in the middle, whose Selected column holds file numbers. The chosen files are copied into a folder named Selected on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08201a"/>
      <stop offset="1" stop-color="#0a1512"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1f4a3a"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e6f5ec">
    <g font-size="16" fill="#a3e635" text-anchor="middle">
      <text x="128" y="44">event folders</text>
      <text x="450" y="44">output.csv</text>
      <text x="772" y="44">Selected/</text>
    </g>

    <g fill="#14352a" stroke="#a3e635" stroke-width="2">
      <path d="M48 84 h44 l12 12 h104 v50 H48 z"/>
      <path d="M48 166 h44 l12 12 h104 v50 H48 z"/>
      <path d="M48 248 h44 l12 12 h104 v50 H48 z"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="128" y="126">Annual Picnic</text>
      <text x="128" y="208">Book Fair</text>
      <text x="128" y="290">Science Show</text>
    </g>

    <rect x="300" y="72" width="300" height="244" rx="12" fill="#0d251d" stroke="#fb923c" stroke-width="2"/>
    <g stroke="#2c5a48" stroke-width="1">
      <path d="M300 124 H600 M300 188 H600 M300 252 H600 M482 72 V316"/>
    </g>
    <g font-size="15">
      <g fill="#fb923c">
        <text x="316" y="104">name</text>
        <text x="498" y="104">Selected</text>
      </g>
      <text x="316" y="162">Annual Picnic</text>
      <text x="498" y="162">"2,5,9"</text>
      <text x="316" y="226">Book Fair</text>
      <text x="498" y="226">"1,4"</text>
      <text x="316" y="290">Science Show</text>
      <text x="498" y="290">"6"</text>
    </g>

    <g stroke="#a3e635" stroke-width="3" fill="none">
      <path d="M222 194 H282"/>
    </g>
    <path d="M276 184 L292 194 L276 204 z" fill="#a3e635"/>
    <path d="M614 194 H660" stroke="#fb923c" stroke-width="3" fill="none"/>
    <path d="M654 184 L670 194 L654 204 z" fill="#fb923c"/>

    <rect x="684" y="72" width="176" height="244" rx="12" fill="#2a1a0c" stroke="#fb923c" stroke-width="2"/>
    <g fill="#14352a" stroke="#a3e635" stroke-width="2">
      <rect x="704" y="96" width="40" height="34" rx="4"/>
      <rect x="752" y="96" width="40" height="34" rx="4"/>
      <rect x="800" y="96" width="40" height="34" rx="4"/>
      <rect x="704" y="176" width="40" height="34" rx="4"/>
      <rect x="752" y="176" width="40" height="34" rx="4"/>
      <rect x="704" y="256" width="40" height="34" rx="4"/>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="724" y="118">2</text>
      <text x="772" y="118">5</text>
      <text x="820" y="118">9</text>
      <text x="724" y="198">1</text>
      <text x="772" y="198">4</text>
      <text x="724" y="278">6</text>
    </g>

    <g font-size="14" fill="#9fc7b3" text-anchor="middle">
      <text x="257" y="342">find / Python</text>
      <text x="642" y="342">copy_selected.py</text>
    </g>
