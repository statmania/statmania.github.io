<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">One touch command creating five files</title>
  <desc id="d">A terminal window shows the command touch file{1..5}.txt. Below it, five small file icons named file1.txt to file5.txt appear in a row.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f2a"/>
      <stop offset="1" stop-color="#0f1022"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#3a2a55"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <rect x="170" y="28" width="560" height="104" rx="12" fill="#120a1f" stroke="#c084fc" stroke-width="2"/>
    <circle cx="194" cy="48" r="5" fill="#fb7185"/>
    <circle cx="212" cy="48" r="5" fill="#facc15"/>
    <circle cx="230" cy="48" r="5" fill="#4ade80"/>
    <text x="200" y="100" font-size="26" text-anchor="start"><tspan fill="#c084fc">$</tspan> touch <tspan fill="#facc15">file{1..5}.txt</tspan></text>
    <path d="M450 140 L450 168" stroke="#c084fc" stroke-width="3" fill="none"/>
    <path d="M440 160 L450 172 L460 160 z" fill="#c084fc"/>
    <g stroke="#facc15" stroke-width="2" fill="#2a1f08">
      <rect x="88" y="190" width="100" height="70" rx="8"/>
      <rect x="236" y="190" width="100" height="70" rx="8"/>
      <rect x="400" y="190" width="100" height="70" rx="8"/>
      <rect x="564" y="190" width="100" height="70" rx="8"/>
      <rect x="712" y="190" width="100" height="70" rx="8"/>
    </g>
    <g font-size="16" fill="#facc15">
      <text x="138" y="230">file1.txt</text>
      <text x="286" y="230">file2.txt</text>
      <text x="450" y="230">file3.txt</text>
      <text x="614" y="230">file4.txt</text>
      <text x="762" y="230">file5.txt</text>
    </g>
  </g>
</svg>
