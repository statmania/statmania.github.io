<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A 3D array in C</title>
  <desc>Two stacked layers, each a 3 by 4 grid of numbers. The element a[1][0][2] is highlighted in layer 1, row 0, column 2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241028"/>
      <stop offset="1" stop-color="#0d070f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" fill="#f3e8f5" text-anchor="middle">
    <text x="600" y="76" font-size="34" font-weight="bold" fill="#a3e635">int a[2][3][4]</text>
    <!-- layer 0 (back) -->
    <g transform="translate(110,130) skewX(-18)">
      <rect x="0" y="0" width="360" height="240" rx="10" fill="#2f1a35" stroke="#fb7185" stroke-width="3"/>
      <g font-size="26">
        <text x="50" y="70">1</text><text x="135" y="70">2</text><text x="220" y="70">3</text><text x="305" y="70">4</text>
        <text x="50" y="130">5</text><text x="135" y="130">6</text><text x="220" y="130">7</text><text x="305" y="130">8</text>
        <text x="50" y="190">9</text><text x="135" y="190">10</text><text x="220" y="190">11</text><text x="305" y="190">12</text>
      </g>
    </g>
    <text x="110" y="400" font-size="22" fill="#fb7185" text-anchor="start">Layer 0</text>
    <!-- layer 1 (front) -->
    <g transform="translate(480,290) skewX(-18)">
      <rect x="0" y="0" width="360" height="240" rx="10" fill="#1f2a12" stroke="#a3e635" stroke-width="3"/>
      <rect x="182" y="30" width="76" height="56" rx="8" fill="#a3e635" opacity="0.25" stroke="#a3e635" stroke-width="3"/>
      <g font-size="26">
        <text x="50" y="70">13</text><text x="135" y="70">14</text><text x="220" y="70" font-weight="bold" fill="#a3e635">15</text><text x="305" y="70">16</text>
        <text x="50" y="130">17</text><text x="135" y="130">18</text><text x="220" y="130">19</text><text x="305" y="130">20</text>
        <text x="50" y="190">21</text><text x="135" y="190">22</text><text x="220" y="190">23</text><text x="305" y="190">24</text>
      </g>
    </g>
    <text x="440" y="565" font-size="22" fill="#a3e635" text-anchor="start">Layer 1</text>
    <!-- callout -->
    <rect x="860" y="130" width="290" height="110" rx="12" fill="#1f2a12" stroke="#a3e635" stroke-width="2"/>
    <text x="1005" y="175" font-size="26" fill="#a3e635">a[1][0][2]</text>
    <text x="1005" y="212" font-size="17" fill="#f3e8f5">layer 1, row 0, col 2 = 15</text>
    <text x="1005" y="280" font-size="18" fill="#b79bbd">[layer][row][column]</text>
  </g>
</svg>
