<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">if / else flowchart</title>
  <desc id="d">A condition is tested. If true, the if-block runs; if false, the else-block runs. Both paths then continue with the rest of the program.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1b2540"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <!-- connectors -->
    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M130 180 H160" marker-end="url(#arrow)"/>
      <path d="M260 120 V70 H420" stroke="#00e5ff" marker-end="url(#arrow)"/>
      <path d="M260 240 V290 H420" stroke="#ff2fb4" marker-end="url(#arrow)"/>
      <path d="M620 70 H700 V180 H740" marker-end="url(#arrow)"/>
      <path d="M620 290 H700 V180"/>
    </g>

    <!-- start -->
    <rect x="20" y="155" width="110" height="50" rx="25" fill="#0a0f1e" stroke="url(#accent)" stroke-width="2"/>
    <text x="75" y="186" fill="#e6edf7" font-size="16">start</text>

    <!-- decision -->
    <polygon points="260,120 360,180 260,240 160,180" fill="#0a0f1e" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
    <text x="260" y="176" fill="#e6edf7" font-size="15">score</text>
    <text x="260" y="196" fill="#e6edf7" font-size="15">&gt;= 60 ?</text>

    <!-- true / false labels -->
    <text x="330" y="90" fill="#00e5ff" font-size="15" font-weight="700">true</text>
    <text x="330" y="282" fill="#ff2fb4" font-size="15" font-weight="700">false</text>

    <!-- branches -->
    <rect x="420" y="40" width="200" height="60" rx="10" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="520" y="66" fill="#8be9ff" font-size="12">if { ... }</text>
    <text x="520" y="86" fill="#e6edf7" font-size="14">printf("Pass");</text>

    <rect x="420" y="260" width="200" height="60" rx="10" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="520" y="286" fill="#ff9bd8" font-size="12">else { ... }</text>
    <text x="520" y="306" fill="#e6edf7" font-size="14">printf("Fail");</text>

    <!-- continue -->
    <rect x="740" y="155" width="140" height="50" rx="25" fill="#0a0f1e" stroke="url(#accent)" stroke-width="2"/>
    <text x="810" y="186" fill="#e6edf7" font-size="16">continue</text>

    <!-- caption -->
    <text x="450" y="348" fill="#6b7a99" font-size="12" letter-spacing="2">ONE CONDITION · TWO PATHS · ONE EXIT</text>
  </g>
</svg>
