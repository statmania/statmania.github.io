<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
<title id="t">Tree of routes from Sylhet to Rajshahi via Dhaka</title>
<desc id="d">Three ways from Sylhet to Dhaka, each followed by two ways from Dhaka to Rajshahi, giving six complete routes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d24"/><stop offset="1" stop-color="#0c1f4a"/></linearGradient></defs>
<rect width="900" height="460" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="450" y="38" font-size="22" font-weight="700" fill="#e8efff">3 ways × 2 ways = 6 routes</text>
<circle cx="90" cy="230" r="26" fill="#e8efff"/><text x="90" y="237" font-size="20" font-weight="700" fill="#06122b">S</text>
<path d="M116 230 L304 100" stroke="#facc15" stroke-width="2.5" fill="none"/>
<text x="202" y="155" font-size="14" fill="#facc15">train</text>
<path d="M356 100 L604 66" stroke="#60a5fa" stroke-width="2" fill="none"/>
<text x="480" y="77" font-size="13" fill="#60a5fa">bus</text>
<circle cx="620" cy="66" r="12" fill="#60a5fa"/>
<path d="M356 100 L604 134" stroke="#60a5fa" stroke-width="2" fill="none"/>
<text x="480" y="135" font-size="13" fill="#60a5fa">train</text>
<circle cx="620" cy="134" r="12" fill="#60a5fa"/>
<path d="M116 230 L304 230" stroke="#facc15" stroke-width="2.5" fill="none"/>
<text x="210" y="218" font-size="14" fill="#facc15">air</text>
<path d="M356 230 L604 196" stroke="#60a5fa" stroke-width="2" fill="none"/>
<text x="480" y="207" font-size="13" fill="#60a5fa">bus</text>
<circle cx="620" cy="196" r="12" fill="#60a5fa"/>
<path d="M356 230 L604 264" stroke="#60a5fa" stroke-width="2" fill="none"/>
<text x="480" y="265" font-size="13" fill="#60a5fa">train</text>
<circle cx="620" cy="264" r="12" fill="#60a5fa"/>
<path d="M116 230 L304 360" stroke="#facc15" stroke-width="2.5" fill="none"/>
<text x="218" y="285" font-size="14" fill="#facc15">bus</text>
<path d="M356 360 L604 326" stroke="#60a5fa" stroke-width="2" fill="none"/>
<text x="480" y="337" font-size="13" fill="#60a5fa">bus</text>
<circle cx="620" cy="326" r="12" fill="#60a5fa"/>
<path d="M356 360 L604 394" stroke="#60a5fa" stroke-width="2" fill="none"/>
<text x="480" y="395" font-size="13" fill="#60a5fa">train</text>
<circle cx="620" cy="394" r="12" fill="#60a5fa"/>
<circle cx="330" cy="100" r="26" fill="#facc15"/><text x="330" y="107" font-size="20" font-weight="700" fill="#06122b">D</text>
<circle cx="330" cy="230" r="26" fill="#facc15"/><text x="330" y="237" font-size="20" font-weight="700" fill="#06122b">D</text>
<circle cx="330" cy="360" r="26" fill="#facc15"/><text x="330" y="367" font-size="20" font-weight="700" fill="#06122b">D</text>
<text x="760" y="236" font-size="16" fill="#9db4e0" text-anchor="start">each leaf =</text><text x="760" y="260" font-size="16" fill="#9db4e0" text-anchor="start">1 complete</text><text x="760" y="284" font-size="16" fill="#9db4e0" text-anchor="start">route</text>
<text x="90" y="285" font-size="13" fill="#9db4e0">Sylhet</text>
<text x="330" y="418" font-size="13" fill="#9db4e0">Dhaka</text>
<text x="620" y="418" font-size="13" fill="#9db4e0">Rajshahi</text>
