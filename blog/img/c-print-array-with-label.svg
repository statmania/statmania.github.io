<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Printing an array with a label once</title>
  <desc id="d">A printf label is printed once before the loop, then the ten array values 2, 5, 7, 10, 12, 15, 18, 20, 23, 25 are printed separated by commas with no trailing comma.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140f"/>
      <stop offset="1" stop-color="#0a1a1f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1f3a33"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <rect x="40" y="30" width="820" height="62" rx="10" fill="#0b1f1c" stroke="#22d3ee" stroke-width="2"/>
    <text x="450" y="68" font-size="19"><tspan fill="#22d3ee">The printed values of the array:</tspan> 2, 5, 7, 10, 12, 15, 18, 20, 23, 25</text>
    <text x="450" y="124" font-size="15" fill="#22d3ee">label: once, before the loop</text>
    <rect x="40" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="77" y="190" font-size="24" fill="#34d399">2</text><text x="77" y="238" font-size="13" fill="#8aa0b8">[0]</text><rect x="122" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="159" y="190" font-size="24" fill="#34d399">5</text><text x="159" y="238" font-size="13" fill="#8aa0b8">[1]</text><rect x="204" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="241" y="190" font-size="24" fill="#34d399">7</text><text x="241" y="238" font-size="13" fill="#8aa0b8">[2]</text><rect x="286" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="323" y="190" font-size="24" fill="#34d399">10</text><text x="323" y="238" font-size="13" fill="#8aa0b8">[3]</text><rect x="368" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="405" y="190" font-size="24" fill="#34d399">12</text><text x="405" y="238" font-size="13" fill="#8aa0b8">[4]</text><rect x="450" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="487" y="190" font-size="24" fill="#34d399">15</text><text x="487" y="238" font-size="13" fill="#8aa0b8">[5]</text><rect x="532" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="569" y="190" font-size="24" fill="#34d399">18</text><text x="569" y="238" font-size="13" fill="#8aa0b8">[6]</text><rect x="614" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="651" y="190" font-size="24" fill="#34d399">20</text><text x="651" y="238" font-size="13" fill="#8aa0b8">[7]</text><rect x="696" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="733" y="190" font-size="24" fill="#34d399">23</text><text x="733" y="238" font-size="13" fill="#8aa0b8">[8]</text><rect x="778" y="150" width="74" height="64" rx="8" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="815" y="190" font-size="24" fill="#34d399">25</text><text x="815" y="238" font-size="13" fill="#8aa0b8">[9]</text>
    <text x="450" y="274" font-size="14" fill="#34d399">numbers + commas inside the loop, newline after it</text>
  </g>
</svg>
