<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Permutations versus combinations of 2 letters from ABC</title>
<desc id="d">Six ordered pairs (AB, BA, AC, CA, BC, CB) collapse into three unordered selections (AB, AC, BC).</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150808"/><stop offset="1" stop-color="#2a1210"/></linearGradient>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker></defs>
<rect width="900" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="450" y="42" font-size="22" font-weight="700" fill="#fbeedd">2 letters from ABC</text>
<text x="170" y="100" font-size="17" fill="#f3d9b1">6 permutations (order matters)</text>
<text x="545" y="100" font-size="17" fill="#2dd4bf">3 combinations</text>
<rect x="50" y="130" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="70" y="158" font-size="22" font-weight="700" fill="#1a0a0a">A</text><rect x="94" y="130" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="114" y="158" font-size="22" font-weight="700" fill="#1a0a0a">B</text>
<rect x="190" y="130" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="210" y="158" font-size="22" font-weight="700" fill="#1a0a0a">B</text><rect x="234" y="130" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="254" y="158" font-size="22" font-weight="700" fill="#1a0a0a">A</text>
<text x="182" y="158" font-size="18" fill="#c99a7a" dx="-6">≠</text>
<path d="M345 150 H 450" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="470" y="130" width="40" height="40" rx="8" fill="#2dd4bf"/><text x="490" y="158" font-size="22" font-weight="700" fill="#1a0a0a">A</text><rect x="514" y="130" width="40" height="40" rx="8" fill="#2dd4bf"/><text x="534" y="158" font-size="22" font-weight="700" fill="#1a0a0a">B</text>
<text x="600" y="158" font-size="18" fill="#2dd4bf" text-anchor="start">1 selection</text>
<rect x="50" y="218" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="70" y="246" font-size="22" font-weight="700" fill="#1a0a0a">A</text><rect x="94" y="218" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="114" y="246" font-size="22" font-weight="700" fill="#1a0a0a">C</text>
<rect x="190" y="218" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="210" y="246" font-size="22" font-weight="700" fill="#1a0a0a">C</text><rect x="234" y="218" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="254" y="246" font-size="22" font-weight="700" fill="#1a0a0a">A</text>
<text x="182" y="246" font-size="18" fill="#c99a7a" dx="-6">≠</text>
<path d="M345 238 H 450" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="470" y="218" width="40" height="40" rx="8" fill="#2dd4bf"/><text x="490" y="246" font-size="22" font-weight="700" fill="#1a0a0a">A</text><rect x="514" y="218" width="40" height="40" rx="8" fill="#2dd4bf"/><text x="534" y="246" font-size="22" font-weight="700" fill="#1a0a0a">C</text>
<text x="600" y="246" font-size="18" fill="#2dd4bf" text-anchor="start">1 selection</text>
<rect x="50" y="306" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="70" y="334" font-size="22" font-weight="700" fill="#1a0a0a">B</text><rect x="94" y="306" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="114" y="334" font-size="22" font-weight="700" fill="#1a0a0a">C</text>
<rect x="190" y="306" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="210" y="334" font-size="22" font-weight="700" fill="#1a0a0a">C</text><rect x="234" y="306" width="40" height="40" rx="8" fill="#f3d9b1"/><text x="254" y="334" font-size="22" font-weight="700" fill="#1a0a0a">B</text>
<text x="182" y="334" font-size="18" fill="#c99a7a" dx="-6">≠</text>
<path d="M345 326 H 450" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="470" y="306" width="40" height="40" rx="8" fill="#2dd4bf"/><text x="490" y="334" font-size="22" font-weight="700" fill="#1a0a0a">B</text><rect x="514" y="306" width="40" height="40" rx="8" fill="#2dd4bf"/><text x="534" y="334" font-size="22" font-weight="700" fill="#1a0a0a">C</text>
<text x="600" y="334" font-size="18" fill="#2dd4bf" text-anchor="start">1 selection</text>
<text x="450" y="395" font-size="17" fill="#fbeedd">3P2 = 6 = 3C2 × 2! = 3 × 2</text>
</g></svg>