<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
  <title>Seven ways to write the key of a stem-and-leaf plot</title>
  <desc>Cards showing key styles: integer, decimal, leaf unit, large numbers, negative, split stem and hybrid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1014"/><stop offset="1" stop-color="#171c22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="52" text-anchor="middle" fill="#f87171" font-size="26" font-weight="bold">The key decodes the plot</text>
  <rect x="40" y="90" width="200" height="90" rx="12" fill="#151b22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="140" y="122" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="bold">Integer</text>
  <text x="140" y="154" text-anchor="middle" fill="#e5e7eb" font-size="17">3 | 4 = 34</text>
  <rect x="300" y="90" width="200" height="90" rx="12" fill="#151b22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="400" y="122" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="bold">Decimal</text>
  <text x="400" y="154" text-anchor="middle" fill="#e5e7eb" font-size="17">2 | 3 = 2.3</text>
  <rect x="560" y="90" width="200" height="90" rx="12" fill="#151b22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="660" y="122" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="bold">Leaf unit</text>
  <text x="660" y="154" text-anchor="middle" fill="#e5e7eb" font-size="17">12 | 4 = 12.04</text>
  <rect x="40" y="200" width="200" height="90" rx="12" fill="#151b22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="140" y="232" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="bold">Large</text>
  <text x="140" y="264" text-anchor="middle" fill="#e5e7eb" font-size="17">4 | 5 = 450</text>
  <rect x="300" y="200" width="200" height="90" rx="12" fill="#151b22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="400" y="232" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="bold">Negative</text>
  <text x="400" y="264" text-anchor="middle" fill="#e5e7eb" font-size="17">-2 | 5 = -25</text>
  <rect x="560" y="200" width="200" height="90" rx="12" fill="#151b22" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="660" y="232" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="bold">Split stem</text>
  <text x="660" y="264" text-anchor="middle" fill="#e5e7eb" font-size="17">1. | 5 = 15</text>
  <rect x="170" y="310" width="200" height="90" rx="12" fill="#151b22" stroke="#f87171" stroke-width="2.5"/>
  <text x="270" y="342" text-anchor="middle" fill="#f87171" font-size="16" font-weight="bold">Hybrid</text>
  <text x="270" y="374" text-anchor="middle" fill="#e5e7eb" font-size="17">15 | 3 = 18</text>
  <rect x="400" y="310" width="230" height="90" rx="12" fill="none"/>
  <text x="515" y="350" text-anchor="middle" fill="#9ca3af" font-size="14">always say how to read</text>
  <text x="515" y="372" text-anchor="middle" fill="#9ca3af" font-size="14">stem and leaf together</text>
</svg>
