<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a multiline git commit message</title>
  <desc id="d">A commit message in a terminal window. Line one is the subject, kept under 50 characters. Line two is blank. Lines three onward are the body, wrapped at 72 characters, explaining why the change was made.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1410"/><stop offset="1" stop-color="#2a1d14"/></linearGradient></defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#5a3a22"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#fff4e8">
    <rect x="36" y="36" width="560" height="288" rx="12" fill="#100b08" stroke="#f97316" stroke-width="3"/>
    <circle cx="62" cy="62" r="6" fill="#f97316"/><circle cx="84" cy="62" r="6" fill="#facc15"/><circle cx="106" cy="62" r="6" fill="#7dd3fc"/>
    <text x="62" y="110" font-size="13" fill="#9a8574">$ git commit</text>
    <text x="62" y="148" font-size="20" fill="#f97316" font-weight="bold">Fix login timeout bug</text>
    <text x="62" y="188" font-size="14" fill="#7dd3fc">(blank line)</text>
    <text x="62" y="228" font-size="17">- Increase token expiry to 2 hours</text>
    <text x="62" y="256" font-size="17">- Fix a case where the session</text>
    <text x="62" y="284" font-size="17">  was cleared unexpectedly</text>
    <path d="M620 148 H650" stroke="#f97316" stroke-width="3"/>
    <text x="662" y="136" font-size="17" fill="#f97316" font-weight="bold">Subject</text>
    <text x="662" y="154" font-size="13">under 50 characters</text>
    <path d="M620 188 H650" stroke="#7dd3fc" stroke-width="3"/>
    <text x="662" y="196" font-size="17" fill="#7dd3fc" font-weight="bold">Blank</text>
    <text x="662" y="214" font-size="13">always</text>
    <path d="M620 256 H650" stroke="#facc15" stroke-width="3"/>
    <text x="662" y="251" font-size="17" fill="#facc15" font-weight="bold">Body</text>
    <text x="662" y="271" font-size="13">72 chars per line,</text>
    <text x="662" y="289" font-size="13">explain why</text>
  </g>
</svg>
