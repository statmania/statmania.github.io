<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>Seven amazing results in statistics</title>
  <desc>Seven cards naming the results: Chebyshev's inequality, the Central Limit Theorem, the Law of Large Numbers, Bayes' theorem, Jensen's inequality, Markov's inequality and the Coupon Collector's problem, each with its key idea.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14173f"/><stop offset="1" stop-color="#0c0e2b"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="52" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="24" font-weight="700" fill="#a3e635">7 amazing results in statistics</text>
  <text x="400" y="80" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#c7d2fe">simple statements with surprisingly far-reaching consequences</text>
  <rect x="40" y="110" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#a3e635" stroke-width="2"/>
  <circle cx="64" cy="136" r="14" fill="#a3e635"/>
  <text x="64" y="142" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">1</text>
  <text x="115" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="700" fill="#eef2ff">Chebyshev</text>
  <text x="115" y="202" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#a3e635">1 - 1/k²</text>
  <rect x="230" y="110" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="254" cy="136" r="14" fill="#60a5fa"/>
  <text x="254" y="142" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">2</text>
  <text x="305" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" font-weight="700" fill="#eef2ff">Central Limit</text>
  <text x="305" y="202" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#60a5fa">bell-shaped means</text>
  <rect x="420" y="110" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#a3e635" stroke-width="2"/>
  <circle cx="444" cy="136" r="14" fill="#a3e635"/>
  <text x="444" y="142" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">3</text>
  <text x="495" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" font-weight="700" fill="#eef2ff">Large Numbers</text>
  <text x="495" y="202" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#a3e635">mean → μ</text>
  <rect x="610" y="110" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="634" cy="136" r="14" fill="#60a5fa"/>
  <text x="634" y="142" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">4</text>
  <text x="685" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="700" fill="#eef2ff">Bayes</text>
  <text x="685" y="202" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#60a5fa">P(A|B)</text>
  <rect x="135" y="240" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#a3e635" stroke-width="2"/>
  <circle cx="159" cy="266" r="14" fill="#a3e635"/>
  <text x="159" y="272" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">5</text>
  <text x="210" y="308" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="700" fill="#eef2ff">Jensen</text>
  <text x="210" y="332" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#a3e635">E[f(X)] ≥ f(E[X])</text>
  <rect x="325" y="240" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="349" cy="266" r="14" fill="#60a5fa"/>
  <text x="349" y="272" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">6</text>
  <text x="400" y="308" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="700" fill="#eef2ff">Markov</text>
  <text x="400" y="332" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#60a5fa">P(X ≥ a) ≤ E[X]/a</text>
  <rect x="515" y="240" width="150" height="110" rx="12" fill="#1a1f4a" stroke="#a3e635" stroke-width="2"/>
  <circle cx="539" cy="266" r="14" fill="#a3e635"/>
  <text x="539" y="272" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#0f1230">7</text>
  <text x="590" y="308" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" font-weight="700" fill="#eef2ff">Coupon Collector</text>
  <text x="590" y="332" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#a3e635">n ln n + 0.577n</text>
  <text x="400" y="390" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#c7d2fe">guarantees, limits and shortcuts that hold for almost any data</text>
</svg>