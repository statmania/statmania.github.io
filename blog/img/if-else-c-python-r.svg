<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">if-else syntax in C, Python and R</title>
  <desc id="d">Three cards compare the same grade if / else-if / else in C, Python and R. C and R use parentheses and braces; Python uses colons, indentation and the keyword elif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="398" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="450" y="36" text-anchor="middle" fill="#6b7a99" font-size="12" letter-spacing="2">THE SAME if / else IF / else · THREE LANGUAGES</text>

    <!-- C -->
    <rect x="30" y="60" width="266" height="300" rx="14" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="52" y="94" fill="#00e5ff" font-size="20" font-weight="700">C</text>
    <g font-size="13.5" fill="#e6edf7" xml:space="preserve">
      <text x="52" y="136">if (score &gt;= 90) {</text>
      <text x="52" y="158" fill="#9fb3d1">    printf("A");</text>
      <text x="52" y="180">} else if (score &gt;= 80) {</text>
      <text x="52" y="202" fill="#9fb3d1">    printf("B");</text>
      <text x="52" y="224">} else {</text>
      <text x="52" y="246" fill="#9fb3d1">    printf("C");</text>
      <text x="52" y="268">}</text>
    </g>
    <rect x="52" y="292" width="222" height="44" rx="8" fill="#00e5ff" fill-opacity=".12"/>
    <text x="163" y="311" text-anchor="middle" fill="#8be9ff" font-size="12">( )  { }  ;</text>
    <text x="163" y="327" text-anchor="middle" fill="#9fb3d1" font-size="11">else if · semicolons</text>

    <!-- Python -->
    <rect x="317" y="60" width="266" height="300" rx="14" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="339" y="94" fill="#c084fc" font-size="20" font-weight="700">Python</text>
    <g font-size="13.5" fill="#e6edf7" xml:space="preserve">
      <text x="339" y="136">if score &gt;= 90:</text>
      <text x="339" y="158" fill="#9fb3d1">    print("A")</text>
      <text x="339" y="180">elif score &gt;= 80:</text>
      <text x="339" y="202" fill="#9fb3d1">    print("B")</text>
      <text x="339" y="224">else:</text>
      <text x="339" y="246" fill="#9fb3d1">    print("C")</text>
    </g>
    <rect x="339" y="292" width="222" height="44" rx="8" fill="#a855f7" fill-opacity=".15"/>
    <text x="450" y="311" text-anchor="middle" fill="#d8b4fe" font-size="12">:  indentation</text>
    <text x="450" y="327" text-anchor="middle" fill="#9fb3d1" font-size="11">elif · no braces or ( )</text>

    <!-- R -->
    <rect x="604" y="60" width="266" height="300" rx="14" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="626" y="94" fill="#ff5fc4" font-size="20" font-weight="700">R</text>
    <g font-size="13.5" fill="#e6edf7" xml:space="preserve">
      <text x="626" y="136">if (score &gt;= 90) {</text>
      <text x="626" y="158" fill="#9fb3d1">  print("A")</text>
      <text x="626" y="180">} else if (score &gt;= 80) {</text>
      <text x="626" y="202" fill="#9fb3d1">  print("B")</text>
      <text x="626" y="224">} else {</text>
      <text x="626" y="246" fill="#9fb3d1">  print("C")</text>
      <text x="626" y="268">}</text>
    </g>
    <rect x="626" y="292" width="222" height="44" rx="8" fill="#ff2fb4" fill-opacity=".14"/>
    <text x="737" y="311" text-anchor="middle" fill="#ff9bd8" font-size="12">( )  { }</text>
    <text x="737" y="327" text-anchor="middle" fill="#9fb3d1" font-size="11">"} else" on the same line</text>
  </g>
</svg>
