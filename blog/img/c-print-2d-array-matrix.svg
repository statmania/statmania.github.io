<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Printing a 2D array as a matrix</title>
  <desc>A 3 by 3 array drawn as a grid. The outer loop moves down the rows, the inner loop moves across the columns, and a newline ends each row of output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141432"/>
      <stop offset="1" stop-color="#090a18"/>
    </linearGradient>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono','DejaVu Sans Mono','Liberation Mono','Fira Code',Consolas,monospace" fill="#e8ecff" text-anchor="middle">
    <text x="600" y="78" font-size="34" font-weight="bold" fill="#fbbf24">Print a 2D array as a matrix</text>
    <!-- grid -->
    <path d="M150 150 h-22 v300 h22 M520 150 h22 v300 h-22" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <g fill="#1d2150" stroke="#60a5fa" stroke-width="2">
      <rect x="160" y="160" width="110" height="80" rx="8"/><rect x="280" y="160" width="110" height="80" rx="8"/><rect x="400" y="160" width="110" height="80" rx="8"/>
      <rect x="160" y="260" width="110" height="80" rx="8"/><rect x="280" y="260" width="110" height="80" rx="8"/><rect x="400" y="260" width="110" height="80" rx="8"/>
      <rect x="160" y="360" width="110" height="80" rx="8"/><rect x="280" y="360" width="110" height="80" rx="8"/><rect x="400" y="360" width="110" height="80" rx="8"/>
    </g>
    <g font-size="30" stroke="none">
      <text x="215" y="212">1</text><text x="335" y="212">2</text><text x="455" y="212">3</text>
      <text x="215" y="312">14</text><text x="335" y="312">25</text><text x="455" y="312">36</text>
      <text x="215" y="412">107</text><text x="335" y="412">208</text><text x="455" y="412">309</text>
    </g>
    <!-- inner loop arrow (row 1) -->
    <path d="M165 148 H 505" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#a1)"/>
    <text x="335" y="132" font-size="18" fill="#fbbf24">inner loop j: columns</text>
    <!-- outer loop arrow -->
    <path d="M85 165 V 435" stroke="#60a5fa" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <text x="70" y="300" font-size="18" fill="#60a5fa" transform="rotate(-90 70 300)">outer loop i: rows</text>
    <text x="335" y="500" font-size="22" fill="#8b93c7">matrix[i][j]</text>
    <!-- output -->
    <rect x="680" y="160" width="440" height="280" rx="14" fill="#05060f" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="710" cy="188" r="6" fill="#fbbf24"/><circle cx="732" cy="188" r="6" fill="#60a5fa"/><circle cx="754" cy="188" r="6" fill="#8b93c7"/>
    <g font-size="30" fill="#e8ecff" xml:space="preserve" text-anchor="start">
      <text x="710" y="270">   1   2   3</text>
      <text x="710" y="330">  14  25  36</text>
      <text x="710" y="390"> 107 208 309</text>
    </g>
    <text x="900" y="500" font-size="22" fill="#8b93c7">printf("%4d", ...) + "\n"</text>
    <path d="M530 300 H 665" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#a1)"/>
  </g>
</svg>
