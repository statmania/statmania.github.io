<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">A cluttered LaTeX folder and a clean one</title>
  <desc id="d">On the left, a folder lists many LaTeX files mixed together. On the right, only the tex file, the PDF and a hidden build folder that holds the helper files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081634"/>
      <stop offset="1" stop-color="#1d1a08"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#24406e"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e8ecf7">
    <!-- left: cluttered folder -->
    <text x="215" y="40" font-size="20" text-anchor="middle" fill="#8aa0b8">pdflatex</text>
    <path d="M60 70 h110 l16 18 h184 v234 h-310 z" fill="#0d2147" stroke="#60a5fa" stroke-opacity=".6"/>
    <g font-size="18">
      <text x="86" y="124" fill="#8aa0b8">report.aux</text>
      <text x="86" y="154" fill="#8aa0b8">report.log</text>
      <text x="86" y="184" fill="#fde047">report.pdf</text>
      <text x="86" y="214" fill="#8aa0b8">report.out</text>
      <text x="86" y="244" fill="#60a5fa">report.tex</text>
      <text x="86" y="274" fill="#8aa0b8">report.toc</text>
      <text x="86" y="304" fill="#8aa0b8">...</text>
    </g>
    <!-- arrow -->
    <path d="M405 195 h78" stroke="#fde047" stroke-width="5" fill="none"/>
    <path d="M478 181 l24 14 l-24 14 z" fill="#fde047"/>
    <!-- right: clean folder -->
    <text x="685" y="40" font-size="20" text-anchor="middle" fill="#fde047">latexmk</text>
    <path d="M530 70 h110 l16 18 h184 v234 h-310 z" fill="#0d2147" stroke="#fde047" stroke-opacity=".7"/>
    <g font-size="18">
      <text x="556" y="130" fill="#fde047">report.pdf</text>
      <text x="556" y="166" fill="#60a5fa">report.tex</text>
    </g>
    <rect x="552" y="196" width="266" height="100" rx="8" fill="none" stroke="#8aa0b8" stroke-dasharray="6 6"/>
    <g font-size="18" fill="#8aa0b8">
      <text x="570" y="228">.build/ (hidden)</text>
      <text x="594" y="256" font-size="15">aux  log  toc</text>
      <text x="594" y="278" font-size="15">fls  fdb_latexmk</text>
    </g>
  </g>
</svg>
