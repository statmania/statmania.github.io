<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>ls -lt lists the newest file first</title>
<desc>A terminal window showing the output of ls -lt: five files listed from the most recently modified, script.R, to the oldest, report.txt, with the newest highlighted.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101418"/><stop offset="1" stop-color="#171d24"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="60" y="70" width="1080" height="490" rx="16" fill="#0b0e12" stroke="#f97316" stroke-width="2.5"/>
<rect x="60" y="70" width="1080" height="52" rx="16" fill="#1b222b"/>
<circle cx="95" cy="96" r="9" fill="#f97316"/><circle cx="125" cy="96" r="9" fill="#a3e635"/><circle cx="155" cy="96" r="9" fill="#38bdf8"/>
<text x="600" y="104" text-anchor="middle" font-size="22" fill="#8b98a5">terminal</text>
<text x="90" y="190" font-size="32" fill="#a3e635">$</text><text x="130" y="190" font-size="32" fill="#e6edf3" font-weight="bold">ls -lt</text>
<text x="90" y="232" font-size="24" fill="#8b98a5">total 20</text>
<rect x="90" y="233" width="1020" height="44" rx="8" fill="#f97316" opacity=".16" stroke="#f97316" stroke-width="2"/>
<text x="115" y="265" font-size="28" fill="#8b98a5">-rw-rw-r--</text>
<text x="460" y="265" font-size="28" fill="#cfd8e0" xml:space="preserve">Oct 20 17:20</text>
<text x="740" y="265" font-size="28" font-weight="bold" fill="#a3e635">script.R</text>
<text x="1010" y="265" font-size="24" fill="#f97316">newest</text>
<text x="115" y="315" font-size="28" fill="#8b98a5">-rw-rw-r--</text>
<text x="460" y="315" font-size="28" fill="#cfd8e0" xml:space="preserve">Oct 15 08:45</text>
<text x="740" y="315" font-size="28" font-weight="normal" fill="#e6edf3">data.csv</text>
<text x="115" y="365" font-size="28" fill="#8b98a5">-rw-rw-r--</text>
<text x="460" y="365" font-size="28" fill="#cfd8e0" xml:space="preserve">Oct 12 11:05</text>
<text x="740" y="365" font-size="28" font-weight="normal" fill="#e6edf3">plot.png</text>
<text x="115" y="415" font-size="28" fill="#8b98a5">-rw-rw-r--</text>
<text x="460" y="415" font-size="28" fill="#cfd8e0" xml:space="preserve">Oct  9 14:10</text>
<text x="740" y="415" font-size="28" font-weight="normal" fill="#e6edf3">notes.md</text>
<text x="115" y="465" font-size="28" fill="#8b98a5">-rw-rw-r--</text>
<text x="460" y="465" font-size="28" fill="#cfd8e0" xml:space="preserve">Oct  2 09:30</text>
<text x="740" y="465" font-size="28" font-weight="normal" fill="#e6edf3">report.txt</text>
<text x="600" y="545" text-anchor="middle" font-size="24" fill="#f97316">newest at the top, oldest at the bottom</text>
</svg>