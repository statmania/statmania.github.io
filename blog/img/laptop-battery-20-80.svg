<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">The 20 to 80 percent battery charging range</title>
  <desc id="d">A horizontal battery bar split into three zones: 0 to 20 percent is a low zone to avoid, 20 to 80 percent is the healthy range, and 80 to 100 percent is a high-voltage zone to avoid sitting in. Small markers show plugging in at 20 percent and unplugging near 80 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#12233f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#26406b"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e6eefc">
    <text x="450" y="58" font-size="26" text-anchor="middle" fill="#fbbf24">Keep it between 20% and 80%</text>
    <!-- battery body: x 80..800 (720 wide), 7.2 px per percent -->
    <rect x="70" y="120" width="740" height="120" rx="20" fill="none" stroke="#e6eefc" stroke-width="5" opacity=".85"/>
    <rect x="814" y="150" width="22" height="60" rx="8" fill="#e6eefc" opacity=".85"/>
    <rect x="80" y="130" width="144" height="100" rx="12" fill="#f87171" opacity=".75"/>
    <rect x="224" y="130" width="432" height="100" fill="#34d399" opacity=".8"/>
    <rect x="656" y="130" width="144" height="100" rx="12" fill="#fbbf24" opacity=".75"/>
    <g font-size="22" text-anchor="middle" fill="#0b1424" font-weight="bold">
      <text x="152" y="188">0-20</text>
      <text x="440" y="188">20-80</text>
      <text x="728" y="188">80-100</text>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="152" y="282" fill="#f87171">deep discharge</text>
      <text x="440" y="282" fill="#34d399">healthy range</text>
      <text x="728" y="282" fill="#fbbf24">high voltage</text>
    </g>
    <g stroke-width="3" stroke-linecap="round">
      <path d="M224 100 V118" stroke="#38bdf8"/>
      <path d="M656 100 V118" stroke="#38bdf8"/>
    </g>
    <g font-size="16" text-anchor="middle" fill="#38bdf8">
      <text x="224" y="94">plug in</text>
      <text x="656" y="94">unplug / limit</text>
    </g>
    <text x="450" y="330" font-size="16" text-anchor="middle" opacity=".6">short top-ups beat long deep cycles</text>
  </g>
</svg>
