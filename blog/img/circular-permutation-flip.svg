<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">A table and a necklace treat the mirror image differently</title>
  <desc id="d">The loops A B C D and A D C B are mirror images. Round a table, which cannot be flipped, they are two different arrangements. As a necklace or bracelet they are one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#230f27"/>
      <stop offset="1" stop-color="#150c1d"/>
    </linearGradient>
  </defs>
  <rect width="760" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="758" height="418" rx="17" fill="none" stroke="#4a2a50"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<text x="380.0" y="42.0" font-size="25" fill="#fcd34d" text-anchor="middle" font-weight="normal">One loop, before and after flipping</text>
<circle cx="180.0" cy="160.0" r="70" fill="none" stroke="#6b4a70" stroke-width="2"/><circle cx="180.0" cy="90.0" r="23" fill="#6b2a1a" stroke="#ff8a65" stroke-width="2.5"/><text x="180.0" y="98.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">A</text><circle cx="250.0" cy="160.0" r="23" fill="#3a2140" stroke="#c3a6c0" stroke-width="2.5"/><text x="250.0" y="168.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">B</text><circle cx="180.0" cy="230.0" r="23" fill="#3a2140" stroke="#c3a6c0" stroke-width="2.5"/><text x="180.0" y="238.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">C</text><circle cx="110.0" cy="160.0" r="23" fill="#3a2140" stroke="#c3a6c0" stroke-width="2.5"/><text x="110.0" y="168.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">D</text>
<circle cx="580.0" cy="160.0" r="70" fill="none" stroke="#6b4a70" stroke-width="2"/><circle cx="580.0" cy="90.0" r="23" fill="#6b2a1a" stroke="#ff8a65" stroke-width="2.5"/><text x="580.0" y="98.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">A</text><circle cx="650.0" cy="160.0" r="23" fill="#3a2140" stroke="#c3a6c0" stroke-width="2.5"/><text x="650.0" y="168.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">D</text><circle cx="580.0" cy="230.0" r="23" fill="#3a2140" stroke="#c3a6c0" stroke-width="2.5"/><text x="580.0" y="238.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">C</text><circle cx="510.0" cy="160.0" r="23" fill="#3a2140" stroke="#c3a6c0" stroke-width="2.5"/><text x="510.0" y="168.7" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="bold">B</text>
<text x="380.0" y="148.0" font-size="44" fill="#5eead4" text-anchor="middle" font-weight="normal">⇄</text>
<text x="380.0" y="188.0" font-size="21" fill="#5eead4" text-anchor="middle" font-weight="normal">flip over</text>
<path d="M40 265 H720 M380 280 V400" stroke="#4a2a50" stroke-width="2" fill="none"/>
<text x="200.0" y="310.0" font-size="25" fill="#ff8a65" text-anchor="middle" font-weight="normal">Round table</text>
<text x="200.0" y="345.0" font-size="20" fill="#c3a6c0" text-anchor="middle" font-weight="normal">no flipping</text>
<text x="200.0" y="385.0" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="normal">2 different</text>
<text x="560.0" y="310.0" font-size="25" fill="#5eead4" text-anchor="middle" font-weight="normal">Necklace / bracelet</text>
<text x="560.0" y="345.0" font-size="20" fill="#c3a6c0" text-anchor="middle" font-weight="normal">flipping allowed</text>
<text x="560.0" y="385.0" font-size="25" fill="#f6eaf4" text-anchor="middle" font-weight="normal">1 and the same</text>
  </g>
</svg>
