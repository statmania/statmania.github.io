<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The R logo containing smaller and smaller copies of itself</title>
  <desc id="d">A large circle with the letter R holds a half-size circle with an R, which holds another half-size circle again, shrinking to the right like a spiral. Lines of R code for a recursive function float beside it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#101c3a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#22335a"/>
  <g>
    <circle cx="270.0" cy="150.0" r="132.0" fill="#0b1630" stroke="#60a5fa" stroke-width="6.6"/>
    <text x="217.2" y="193.6" font-size="132.0" font-weight="700" fill="#60a5fa" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">R</text>
    <circle cx="326.8" cy="163.2" r="66.0" fill="#0b1630" stroke="#a3e635" stroke-width="3.3"/>
    <text x="300.4" y="185.0" font-size="66.0" font-weight="700" fill="#a3e635" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">R</text>
    <circle cx="355.1" cy="156.6" r="33.0" fill="#0b1630" stroke="#60a5fa" stroke-width="1.7"/>
    <text x="341.9" y="167.5" font-size="33.0" font-weight="700" fill="#60a5fa" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">R</text>
    <circle cx="369.3" cy="159.9" r="16.5" fill="#0b1630" stroke="#a3e635" stroke-width="1.4"/>
    <text x="362.7" y="165.3" font-size="16.5" font-weight="700" fill="#a3e635" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">R</text>
    <circle cx="376.4" cy="158.2" r="8.2" fill="#0b1630" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="373.1" y="161.0" font-size="8.2" font-weight="700" fill="#60a5fa" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">R</text>
  </g>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <text transform="translate(540 64) rotate(-3)" font-size="18" fill="#a3e635" opacity="0.95">f &lt;- function(n) {</text>
  <text transform="translate(580 112) rotate(2)" font-size="16" fill="#60a5fa" opacity="0.85">  if (n &lt;= 1) return(1)</text>
  <text transform="translate(560 160) rotate(-2)" font-size="18" fill="#a3e635" opacity="0.75">  n * f(n - 1)</text>
  <text transform="translate(600 208) rotate(3)" font-size="16" fill="#60a5fa" opacity="0.65">}</text>
  <text transform="translate(540 252) rotate(-3)" font-size="16" fill="#a3e635" opacity="0.55">Recall(n - 1)</text>
  </g>
</svg>
