<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Rolling a die until 6 appears</title>
  <desc id="d">Flowchart: roll the die and record it; if the roll is not 6, roll again; if it is 6, stop and report the number of steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-size="16" fill="#e8ecf7">
    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M170 130 H230" marker-end="url(#arrow)"/>
      <path d="M440 130 H520" marker-end="url(#arrow)"/>
      <path d="M690 130 H740" marker-end="url(#arrow)"/>
      <path d="M605 175 V240 H335 V175" stroke="#ff2fb4" marker-end="url(#arrow)"/>
    </g>
    <rect x="30" y="100" width="140" height="60" rx="30" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="100" y="136">start</text>
    <rect x="230" y="90" width="210" height="80" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="335" y="124">roll, store,</text>
    <text x="335" y="146">count++</text>
    <polygon points="605,80 690,130 605,180 520,130" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="605" y="136">dice == 6?</text>
    <rect x="740" y="100" width="130" height="60" rx="30" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="805" y="136">report</text>
    <text x="715" y="118" fill="#00e5ff" font-size="14">yes</text>
    <text x="705" y="232" fill="#ff2fb4" font-size="14">no: roll again</text>
  </g>
</svg>
