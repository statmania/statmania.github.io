<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>Timing code with clock()</title>
  <desc>A timeline with a start clock() reading, a block of work, and an end clock() reading, with the difference divided by CLOCKS_PER_SEC giving seconds.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0f08"/><stop offset="1" stop-color="#0a2a2c"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" fill="#fff1e6" font-weight="bold">Read the clock before and after</text>
  <line x1="70" y1="210" x2="730" y2="210" stroke="#2fd4c4" stroke-width="3"/>
  <rect x="210" y="170" width="380" height="80" rx="10" fill="#3a2410" stroke="#ff8a3d" stroke-width="2"/>
  <text x="400" y="218" text-anchor="middle" font-size="20" fill="#ffc799">code being timed</text>
  <g stroke="#2fd4c4" stroke-width="3"><line x1="210" y1="140" x2="210" y2="280"/><line x1="590" y1="140" x2="590" y2="280"/></g>
  <g font-size="17" text-anchor="middle" fill="#7ff0e3"><text x="210" y="128">start = clock()</text><text x="590" y="128">end = clock()</text></g>
  <path d="M210 290 H590" stroke="#ff8a3d" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="19" fill="#ffc799">seconds = (end - start) / CLOCKS_PER_SEC</text>
  <text x="400" y="372" text-anchor="middle" font-size="15" fill="#7ff0e3">CPU time used by the program, not wall-clock time</text>
</svg>
