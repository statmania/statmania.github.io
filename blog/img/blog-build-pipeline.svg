<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">How the blog is built and published</title>
  <desc id="d">Posts and authors.yml feed a pre-render script that writes site-data.js. Quarto renders the posts to the blog folder. Git push sends the committed HTML to GitHub Pages. In the browser, site.js reads site-data.js to build the archive, tags, related posts and author pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
  </defs>
  <rect width="900" height="340" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="338" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-size="14" fill="#e8ecf7">
    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M190 90 H260" marker-end="url(#arrow)"/>
      <path d="M190 200 H260" marker-end="url(#arrow)"/>
      <path d="M440 90 H520" marker-end="url(#arrow)"/>
      <path d="M440 200 H520" marker-end="url(#arrow)"/>
      <path d="M690 90 H730" marker-end="url(#arrow)"/>
      <path d="M690 200 H730" marker-end="url(#arrow)"/>
    </g>
    <rect x="20" y="60" width="170" height="60" rx="10" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="105" y="86">posts/*.qmd</text><text x="105" y="104" font-size="12" fill="#9aa4c2">you write these</text>
    <rect x="20" y="170" width="170" height="60" rx="10" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="105" y="196">authors.yml</text><text x="105" y="214" font-size="12" fill="#9aa4c2">bios and photos</text>
    <rect x="260" y="60" width="180" height="60" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="350" y="86">quarto render</text><text x="350" y="104" font-size="12" fill="#9aa4c2">HTML into blog/</text>
    <rect x="260" y="170" width="180" height="60" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="350" y="196">pre-render hook</text><text x="350" y="214" font-size="12" fill="#9aa4c2">build_site_data.py</text>
    <rect x="520" y="60" width="170" height="70" rx="10" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="605" y="88">blog/*.html</text><text x="605" y="106" font-size="12" fill="#9aa4c2">committed to git</text>
    <rect x="520" y="170" width="170" height="60" rx="10" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="605" y="196">site-data.js</text><text x="605" y="214" font-size="12" fill="#9aa4c2">+ site.js</text>
    <rect x="730" y="60" width="150" height="60" rx="30" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="805" y="86">git push</text><text x="805" y="104" font-size="12" fill="#9aa4c2">GitHub Pages</text>
    <rect x="730" y="170" width="150" height="60" rx="30" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="805" y="196">browser</text><text x="805" y="214" font-size="12" fill="#9aa4c2">builds the widgets</text>
    <text x="450" y="290" fill="#9aa4c2" font-size="13">publish.sh runs the whole chain: render, commit, push</text>
  </g>
</svg>
