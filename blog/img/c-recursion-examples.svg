<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <title>Recursion call stack in C</title>
  <desc>Four stacked boxes factorial(4) down to factorial(0) with a down arrow for calls and an up arrow for returned values 1, 1, 2, 6, 24.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061a12"/><stop offset="1" stop-color="#0b2a1c"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffb020"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3ddc84"/></marker>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" fill="#e8fff2" font-weight="bold">Recursion: go down, hit the base, come back up</text>
  <g font-size="18">
    <rect x="220" y="70" width="360" height="52" rx="8" fill="#0f3d28" stroke="#3ddc84" stroke-width="2"/><text x="400" y="103" text-anchor="middle" fill="#e8fff2">factorial(4) = 4 * ...</text>
    <rect x="220" y="140" width="360" height="52" rx="8" fill="#0f3d28" stroke="#3ddc84" stroke-width="2"/><text x="400" y="173" text-anchor="middle" fill="#e8fff2">factorial(3) = 3 * ...</text>
    <rect x="220" y="210" width="360" height="52" rx="8" fill="#0f3d28" stroke="#3ddc84" stroke-width="2"/><text x="400" y="243" text-anchor="middle" fill="#e8fff2">factorial(2) = 2 * ...</text>
    <rect x="220" y="280" width="360" height="52" rx="8" fill="#0f3d28" stroke="#3ddc84" stroke-width="2"/><text x="400" y="313" text-anchor="middle" fill="#e8fff2">factorial(1) = 1 * ...</text>
    <rect x="220" y="350" width="360" height="52" rx="8" fill="#4a3300" stroke="#ffb020" stroke-width="2"/><text x="400" y="383" text-anchor="middle" fill="#ffd27a">factorial(0) = 1  (base)</text>
  </g>
  <line x1="150" y1="80" x2="150" y2="385" stroke="#ffb020" stroke-width="3" marker-end="url(#a)"/>
  <text x="150" y="64" text-anchor="middle" font-size="15" fill="#ffd27a">calls</text>
  <line x1="650" y1="385" x2="650" y2="80" stroke="#3ddc84" stroke-width="3" marker-end="url(#g)"/>
  <text x="650" y="64" text-anchor="middle" font-size="15" fill="#8ff0b8">returns</text>
  <g font-size="16" fill="#8ff0b8" text-anchor="middle"><text x="690" y="375">1</text><text x="690" y="305">1</text><text x="690" y="235">2</text><text x="690" y="165">6</text><text x="690" y="100">24</text></g>
</svg>
