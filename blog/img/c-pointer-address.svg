<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Array addresses: the base moves, the gaps stay</title>
  <desc id="d">Two runs of the same program place an int array of four elements at different base addresses, but in both runs neighbouring elements are 4 bytes apart and a pointer p points at the first element.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08121f"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1f3040"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <text x="450" y="38" font-size="19">int a[4] = {25, 50, 75, 100};</text>
    <text x="40" y="82" font-size="15" fill="#38bdf8" text-anchor="start">Run 1: base 0x7ffd4a3c2b40</text>
    <text x="40" y="198" font-size="15" fill="#a3e635" text-anchor="start">Run 2: base 0x7ffc81e9d5a0</text>
    <g stroke-width="2">
      <rect x="40" y="96" width="120" height="56" rx="8" fill="#0c2233" stroke="#38bdf8"/>
      <rect x="170" y="96" width="120" height="56" rx="8" fill="#0c2233" stroke="#38bdf8"/>
      <rect x="300" y="96" width="120" height="56" rx="8" fill="#0c2233" stroke="#38bdf8"/>
      <rect x="430" y="96" width="120" height="56" rx="8" fill="#0c2233" stroke="#38bdf8"/>
      <rect x="40" y="212" width="120" height="56" rx="8" fill="#1a2a0c" stroke="#a3e635"/>
      <rect x="170" y="212" width="120" height="56" rx="8" fill="#1a2a0c" stroke="#a3e635"/>
      <rect x="300" y="212" width="120" height="56" rx="8" fill="#1a2a0c" stroke="#a3e635"/>
      <rect x="430" y="212" width="120" height="56" rx="8" fill="#1a2a0c" stroke="#a3e635"/>
    </g>
    <g font-size="24">
      <text x="100" y="132" fill="#38bdf8">25</text><text x="230" y="132" fill="#38bdf8">50</text>
      <text x="360" y="132" fill="#38bdf8">75</text><text x="490" y="132" fill="#38bdf8">100</text>
      <text x="100" y="248" fill="#a3e635">25</text><text x="230" y="248" fill="#a3e635">50</text>
      <text x="360" y="248" fill="#a3e635">75</text><text x="490" y="248" fill="#a3e635">100</text>
    </g>
    <g font-size="13" fill="#8aa0b8">
      <text x="100" y="170">+0</text><text x="230" y="170">+4</text><text x="360" y="170">+8</text><text x="490" y="170">+12</text>
      <text x="100" y="286">+0</text><text x="230" y="286">+4</text><text x="360" y="286">+8</text><text x="490" y="286">+12</text>
    </g>
    <rect x="620" y="96" width="240" height="172" rx="12" fill="#101a24" stroke="#2c3e50" stroke-width="2"/>
    <text x="740" y="130" font-size="16" fill="#38bdf8">base: changes</text>
    <text x="740" y="156" font-size="13" fill="#8aa0b8">(ASLR, per run)</text>
    <text x="740" y="196" font-size="16" fill="#a3e635">gap: always 4</text>
    <text x="740" y="222" font-size="13" fill="#8aa0b8">(sizeof(int))</text>
    <text x="740" y="256" font-size="15" fill="#e8ecf7">*p is always 25</text>
  </g>
</svg>
