<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How srand(time(NULL)) seeds rand()</title>
  <desc id="d">The clock value from time(NULL) is passed to srand as the seed; rand then produces a repeatable sequence of numbers from that seed. A different second gives a different seed and a different sequence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-size="16" fill="#e8ecf7">
    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M200 130 H260" marker-end="url(#arrow)"/>
      <path d="M440 130 H500" marker-end="url(#arrow)"/>
      <path d="M680 130 H730" marker-end="url(#arrow)"/>
    </g>
    <rect x="20" y="95" width="180" height="70" rx="12" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="110" y="124">time(NULL)</text>
    <text x="110" y="146" font-size="13" fill="#9aa4c2">seconds since 1970</text>
    <rect x="260" y="95" width="180" height="70" rx="12" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="350" y="124">srand(seed)</text>
    <text x="350" y="146" font-size="13" fill="#9aa4c2">set the start point</text>
    <rect x="500" y="95" width="180" height="70" rx="12" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="590" y="124">rand()</text>
    <text x="590" y="146" font-size="13" fill="#9aa4c2">next number in line</text>
    <rect x="730" y="95" width="150" height="70" rx="12" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="805" y="124">84 87 78</text>
    <text x="805" y="146" font-size="13" fill="#9aa4c2">16 94 ...</text>
    <text x="450" y="238" font-size="14" fill="#9aa4c2">same seed → same sequence · new second → new seed → new sequence</text>
  </g>
</svg>
