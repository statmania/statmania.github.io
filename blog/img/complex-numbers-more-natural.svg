<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Adding waves as complex numbers</title>
<desc>A phasor diagram: a horizontal arrow of length 3 and a vertical arrow of length 4 add up to a diagonal arrow of length 5 at 53 degrees, which is the combined wave.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1a1a"/><stop offset="1" stop-color="#1b2a2a"/></linearGradient></defs>
<rect width="800" height="420" fill="url(#bg)"/>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
<text x="400" y="48" font-size="25" fill="#ff8c42" font-weight="bold">waves add like arrows</text>
<line x1="130" y1="340" x2="560" y2="340" stroke="#e4ecec" stroke-width="1.5"/>
<line x1="150" y1="360" x2="150" y2="90" stroke="#e4ecec" stroke-width="1.5"/>
<line x1="150" y1="340" x2="360" y2="340" stroke="#c4b5fd" stroke-width="5"/>
<polygon points="360,331 378,340 360,349" fill="#c4b5fd"/>
<line x1="378" y1="340" x2="378" y2="143" stroke="#c4b5fd" stroke-width="5" stroke-dasharray="1 0"/>
<polygon points="369,143 378,125 387,143" fill="#c4b5fd"/>
<line x1="150" y1="340" x2="375" y2="130" stroke="#ff8c42" stroke-width="5"/>
<circle cx="378" cy="127" r="7" fill="#ff8c42"/>
<text x="264" y="368" font-size="18" fill="#c4b5fd">3</text>
<text x="404" y="240" font-size="18" fill="#c4b5fd" text-anchor="start">4i</text>
<text x="238" y="214" font-size="20" fill="#ff8c42" font-weight="bold" text-anchor="end">5</text>
<path d="M200,340 A50,50 0 0 0 190,311" fill="none" stroke="#ff8c42" stroke-width="2.5"/>
<text x="214" y="322" font-size="15" fill="#ff8c42" text-anchor="start">53°</text>
<g font-size="18" text-anchor="start" fill="#e4ecec"><text x="470" y="170">3cos t + 4cos(t + 90°)</text><text x="470" y="200" fill="#ff8c42" font-weight="bold">= 5cos(t + 53°)</text><text x="470" y="250" font-size="15" fill="#9fb8b8">no trig identities needed:</text><text x="470" y="274" font-size="15" fill="#9fb8b8">3 + 4i has length 5, angle 53°</text></g>
</g></svg>
