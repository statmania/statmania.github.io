<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Double summation as a grand total</title>
  <desc id="d">A table of weekly sales for three stores over four weeks. Each row is summed first, giving 52, 79 and 40, then the row totals are added to give the grand total 171, written as a sum over i of a sum over j of y sub i j.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06201c"/><stop offset="1" stop-color="#0b2e2a"/></linearGradient></defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#14574f"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e6fff8">
  <text x="450" y="50" font-size="30" text-anchor="middle" fill="#2dd4bf">Σ Σ y<tspan font-size="16" dy="6">ij</tspan></text>
  <text x="450" y="80" font-size="15" text-anchor="middle" fill="#a3e635">add each row, then add the row totals</text>
<text x="290.0" y="110" font-size="15" text-anchor="middle" fill="#7dd3c8">wk 1</text>
<text x="370.0" y="110" font-size="15" text-anchor="middle" fill="#7dd3c8">wk 2</text>
<text x="450.0" y="110" font-size="15" text-anchor="middle" fill="#7dd3c8">wk 3</text>
<text x="530.0" y="110" font-size="15" text-anchor="middle" fill="#7dd3c8">wk 4</text>
<text x="620.0" y="110" font-size="15" text-anchor="middle" fill="#a3e635">Σ row</text>
<text x="236" y="150.0" font-size="16" text-anchor="end" fill="#7dd3c8">Store A</text>
<rect x="253" y="123" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="290.0" y="151.0" font-size="20" text-anchor="middle">12</text>
<rect x="333" y="123" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="370.0" y="151.0" font-size="20" text-anchor="middle">15</text>
<rect x="413" y="123" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="450.0" y="151.0" font-size="20" text-anchor="middle">11</text>
<rect x="493" y="123" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="530.0" y="151.0" font-size="20" text-anchor="middle">14</text>
<rect x="583" y="123" width="74" height="42" rx="8" fill="#26400f" stroke="#a3e635"/>
<text x="620.0" y="151.0" font-size="20" text-anchor="middle" fill="#a3e635">52</text>
<text x="236" y="198.0" font-size="16" text-anchor="end" fill="#7dd3c8">Store B</text>
<rect x="253" y="171" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="290.0" y="199.0" font-size="20" text-anchor="middle">20</text>
<rect x="333" y="171" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="370.0" y="199.0" font-size="20" text-anchor="middle">18</text>
<rect x="413" y="171" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="450.0" y="199.0" font-size="20" text-anchor="middle">22</text>
<rect x="493" y="171" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="530.0" y="199.0" font-size="20" text-anchor="middle">19</text>
<rect x="583" y="171" width="74" height="42" rx="8" fill="#26400f" stroke="#a3e635"/>
<text x="620.0" y="199.0" font-size="20" text-anchor="middle" fill="#a3e635">79</text>
<text x="236" y="246.0" font-size="16" text-anchor="end" fill="#7dd3c8">Store C</text>
<rect x="253" y="219" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="290.0" y="247.0" font-size="20" text-anchor="middle">9</text>
<rect x="333" y="219" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="370.0" y="247.0" font-size="20" text-anchor="middle">10</text>
<rect x="413" y="219" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="450.0" y="247.0" font-size="20" text-anchor="middle">8</text>
<rect x="493" y="219" width="74" height="42" rx="8" fill="#0f3d37" stroke="#2dd4bf"/>
<text x="530.0" y="247.0" font-size="20" text-anchor="middle">13</text>
<rect x="583" y="219" width="74" height="42" rx="8" fill="#26400f" stroke="#a3e635"/>
<text x="620.0" y="247.0" font-size="20" text-anchor="middle" fill="#a3e635">40</text>
<rect x="583" y="278" width="74" height="42" rx="8" fill="#a3e635"/>
<text x="620.0" y="306.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#06201c">171</text>
<text x="560" y="306.0" font-size="16" text-anchor="end" fill="#a3e635">grand total</text>
</g></svg>